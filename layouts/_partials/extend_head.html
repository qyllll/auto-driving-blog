<style>
:root {
  --main-width: 900px;
}
</style>

<!-- KaTeX -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script>(function(){function init(){renderMathInElement(document.body,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false},{left:'\\[',right:'\\]',display:true},{left:'\\(',right:'\\)',display:false}],throwOnError:false})}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init()})()</script>

<!-- busuanzi 浏览统计 -->
<script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
<style>
  .post-meta .busuanzi-wrap, .entry-footer .busuanzi-wrap {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
  }
</style>

<!-- 收藏按钮样式 -->
<style>
  .fav-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-left: 10px;
    padding: 4px 14px;
    font-size: 0.85rem;
    font-weight: 600;
    border-radius: 100px;
    cursor: pointer;
    user-select: none;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    border: 1px solid rgba(129, 140, 248, 0.35);
    background: rgba(129, 140, 248, 0.1);
    color: #a5b4fc;
    vertical-align: middle;
    line-height: 1.6;
  }
  .fav-btn:hover {
    background: rgba(129, 140, 248, 0.2);
    border-color: rgba(129, 140, 248, 0.6);
  }
  .fav-btn.fav-active {
    background: rgba(250, 204, 21, 0.15);
    border-color: rgba(250, 204, 21, 0.55);
    color: #facc15;
  }
  .fav-btn svg { flex-shrink: 0; }
  [data-theme="light"] .fav-btn {
    background: rgba(99, 102, 241, 0.08);
    color: #6366f1;
  }
  [data-theme="light"] .fav-btn.fav-active {
    background: rgba(245, 158, 11, 0.12);
    color: #d97706;
  }
</style>
<script>
(function () {
  const STORAGE_KEY = "fav_posts";
  const MAX_FAVS = 200;

  function getFavs() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  }
  function setFavs(list) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); } catch (e) {}
  }

  function isFaved(url) {
    return getFavs().some(function (f) { return f.url === url; });
  }

  function toggleFav() {
    const url = window.location.href.split("#")[0].split("?")[0];
    const titleEl = document.querySelector(".post-header .post-title");
    const title = titleEl ? titleEl.textContent.trim() : document.title;
    const dateEl = document.querySelector(".post-header .post-meta");
    let date = "";
    if (dateEl) {
      const m = dateEl.textContent.match(/(\d{4}年\d{1,2}月\d{1,2}日)|(\d{4}-\d{2}-\d{2})|(\d{4} \w{3} \d{1,2})/);
      if (m) date = m[0];
    }
    let list = getFavs();
    if (isFaved(url)) {
      list = list.filter(function (f) { return f.url !== url; });
      setFavs(list);
      updateFavButton(false);
      showFavToast("已取消收藏");
    } else {
      list.unshift({ url: url, title: title, date: date, added: Date.now() });
      if (list.length > MAX_FAVS) list = list.slice(0, MAX_FAVS);
      setFavs(list);
      updateFavButton(true);
      showFavToast("已加入收藏夹 ⭐");
    }
  }

  function updateFavButton(active) {
    const btn = document.getElementById("fav-btn");
    if (!btn) return;
    btn.classList.toggle("fav-active", active);
    btn.innerHTML = (active ? FAV_STAR_SVG : FAV_STAR_SVG_OUTLINE) + "<span>" + (active ? "已收藏" : "收藏") + "</span>";
  }

  const FAV_STAR_SVG = '<svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>';
  const FAV_STAR_SVG_OUTLINE = '<svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>';

  function showFavToast(msg) {
    let toast = document.getElementById("fav-toast");
    if (!toast) {
      toast = document.createElement("div");
      toast.id = "fav-toast";
      toast.style.cssText = "position:fixed;top:70px;left:50%;transform:translateX(-50%);background:rgba(30,35,50,0.95);color:#fff;padding:10px 22px;border-radius:100px;font-size:0.9rem;z-index:9999;box-shadow:0 8px 30px rgba(0,0,0,0.3);opacity:0;transition:opacity .3s;pointer-events:none;border:1px solid rgba(129,140,248,.3)";
      document.body.appendChild(toast);
    }
    toast.textContent = msg;
    toast.style.opacity = "1";
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { toast.style.opacity = "0"; }, 1600);
  }

  function initFavButton() {
    const h1 = document.querySelector(".post-header .post-title");
    if (!h1 || document.getElementById("fav-btn")) return;
    // 仅文章页注入
    if (!document.querySelector(".post-single")) return;

    const btn = document.createElement("button");
    btn.id = "fav-btn";
    btn.className = "fav-btn";
    btn.setAttribute("aria-label", "收藏本文");
    btn.addEventListener("click", toggleFav);
    h1.appendChild(btn);

    const url = window.location.href.split("#")[0].split("?")[0];
    updateFavButton(isFaved(url));
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initFavButton);
  } else {
    initFavButton();
  }
})();
</script>
