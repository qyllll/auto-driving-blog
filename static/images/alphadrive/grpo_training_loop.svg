<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4A5568"/>
    </marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#3182CE"/>
    </marker>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <text x="500" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#2D3748">AlphaDrive 的 GRPO 训练循环</text>
  <text x="500" y="55" text-anchor="middle" font-size="12" fill="#718096">同一个 query 采样 G 条输出 → 四条规划奖励 → 组内归一化优势 → 策略更新 → 回到采样</text>

  <!-- Step 1: query -->
  <rect x="60" y="95" width="200" height="75" rx="10" fill="#EBF8FF" stroke="#3182CE" stroke-width="2" filter="url(#sh)"/>
  <text x="160" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#2B6CB0">① 输入 query q</text>
  <text x="160" y="142" text-anchor="middle" font-size="10" fill="#4A5568">前视图像 + 当前车速</text>
  <text x="160" y="158" text-anchor="middle" font-size="10" fill="#4A5568">+ 高德导航文本</text>

  <line x1="260" y1="132" x2="320" y2="132" stroke="#4A5568" stroke-width="2" marker-end="url(#a1)"/>

  <!-- Step 2: sample group -->
  <rect x="330" y="90" width="280" height="85" rx="10" fill="#F0FFF4" stroke="#38A169" stroke-width="2" filter="url(#sh)"/>
  <text x="470" y="117" text-anchor="middle" font-size="14" font-weight="bold" fill="#276749">② 从 π_θ_old 采样一组</text>
  <text x="470" y="137" text-anchor="middle" font-size="10" fill="#4A5568">{o₁, o₂, …, o_G}，G 条带 &lt;think&gt; 的规划</text>
  <text x="470" y="153" text-anchor="middle" font-size="10" fill="#4A5568">num_answers = G</text>

  <line x1="610" y1="132" x2="670" y2="132" stroke="#4A5568" stroke-width="2" marker-end="url(#a1)"/>

  <!-- Step 3: rewards -->
  <rect x="680" y="90" width="260" height="130" rx="10" fill="#FFFAF0" stroke="#DD6B20" stroke-width="2" filter="url(#sh)"/>
  <text x="810" y="117" text-anchor="middle" font-size="14" font-weight="bold" fill="#C05621">③ 四条规划奖励</text>
  <text x="695" y="140" font-size="10" fill="#4A5568">· Accuracy（F1 横向/纵向）</text>
  <text x="695" y="156" font-size="10" fill="#4A5568">· Action-Weighted（关键动作加权）</text>
  <text x="695" y="172" font-size="10" fill="#4A5568">· Diversity（组内多样性）</text>
  <text x="695" y="188" font-size="10" fill="#4A5568">· Format（&lt;think&gt;/&lt;answer&gt;）</text>
  <text x="695" y="206" font-size="10" fill="#C05621" font-weight="bold">每个 o_i 得到 (speed_R, path_R, format_R)</text>

  <!-- Arrow down from rewards -->
  <line x1="810" y1="220" x2="810" y2="285" stroke="#4A5568" stroke-width="2" marker-end="url(#a1)"/>

  <!-- Step 4: advantage -->
  <rect x="640" y="295" width="300" height="95" rx="10" fill="#FAF5FF" stroke="#805AD5" stroke-width="2" filter="url(#sh)"/>
  <text x="790" y="322" text-anchor="middle" font-size="14" font-weight="bold" fill="#6B46C1">④ 组内归一化优势</text>
  <text x="790" y="346" text-anchor="middle" font-size="11" fill="#4A5568">A_i = (r_i − mean(r₁..r_G)) / std(r₁..r_G)</text>
  <text x="790" y="366" text-anchor="middle" font-size="10" fill="#718096">不学价值网络，用组内均值当基线</text>

  <line x1="790" y1="390" x2="790" y2="440" stroke="#4A5568" stroke-width="2" marker-end="url(#a1)"/>

  <!-- Step 5: PPO objective -->
  <rect x="600" y="450" width="340" height="105" rx="10" fill="#FFF5F5" stroke="#E53E3E" stroke-width="2" filter="url(#sh)"/>
  <text x="770" y="477" text-anchor="middle" font-size="14" font-weight="bold" fill="#C53030">⑤ GRPO 目标（clip + KL）</text>
  <text x="770" y="501" text-anchor="middle" font-size="11" fill="#4A5568">J = E[ (1/G) Σᵢ min(wᵢAᵢ, clip(wᵢ)Aᵢ)</text>
  <text x="770" y="519" text-anchor="middle" font-size="11" fill="#4A5568">    − β·D_KL(π_θ ‖ π_ref) ]</text>
  <text x="770" y="541" text-anchor="middle" font-size="10" fill="#718096">wᵢ = π_θ(oᵢ|q) / π_θ_old(oᵢ|q)</text>

  <line x1="770" y1="555" x2="770" y2="590" stroke="#4A5568" stroke-width="2" marker-end="url(#a1)"/>

  <!-- Step 6: update -->
  <rect x="640" y="600" width="300" height="60" rx="10" fill="#EDF2F7" stroke="#4A5568" stroke-width="2" filter="url(#sh)"/>
  <text x="790" y="627" text-anchor="middle" font-size="13" font-weight="bold" fill="#2D3748">⑥ 更新参数 θ</text>
  <text x="790" y="647" text-anchor="middle" font-size="10" fill="#4A5568">全参微调 Qwen2VL-2B（16×A800）</text>

  <!-- loop back -->
  <path d="M640,630 Q480,630 470,550 Q460,470 470,300 Q475,175 470,132 L330,132" fill="none" stroke="#3182CE" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#a2)"/>
  <text x="500" y="640" font-size="11" fill="#3182CE" font-weight="bold">下一个 query / epoch（on-policy）</text>

  <!-- on-policy note -->
  <rect x="60" y="560" width="240" height="110" rx="8" fill="#FFF5F5" stroke="#FC8181" stroke-width="1.5"/>
  <text x="180" y="585" text-anchor="middle" font-size="12" font-weight="bold" fill="#C53030">⚠️ 为什么用 GRPO 而非 PPO</text>
  <text x="75" y="605" font-size="10" fill="#4A5568">• PPO 需训练 value 网络当基线</text>
  <text x="75" y="621" font-size="10" fill="#4A5568">  小模型上 critic 不准 → 方差爆炸</text>
  <text x="75" y="641" font-size="10" fill="#4A5568">• GRPO 用组内均值当基线，零价值网络</text>
  <text x="75" y="657" font-size="10" fill="#4A5568">• 多解规划：组内相对优劣天然适配</text>

  <!-- key formula note -->
  <rect x="60" y="235" width="240" height="90" rx="8" fill="#EBF8FF" stroke="#63B3ED" stroke-width="1.5"/>
  <text x="180" y="258" text-anchor="middle" font-size="12" font-weight="bold" fill="#2B6CB0">📊 关键超参</text>
  <text x="75" y="278" font-size="10" fill="#4A5568">• G = num_answers（组大小）</text>
  <text x="75" y="294" font-size="10" fill="#4A5568">• ε：clip 范围，防止单步更新过猛</text>
  <text x="75" y="310" font-size="10" fill="#4A5568">• β：KL 惩罚权重，防偏离参考模型</text>
</svg>