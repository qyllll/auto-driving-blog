<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1180" height="640" fill="#fafbfc"/>
  <text x="590" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">DriveVLA-M0 数据流总览：离线写记忆｜在线检索 + 测试时训练（TTT）</text>

  <!-- ============ 上半：离线 Memory Generation ============ -->
  <rect x="30" y="50" width="1120" height="258" rx="10" fill="#f1f8e9" stroke="#558b2f"/>
  <text x="50" y="74" font-size="13" font-weight="bold" fill="#33691e">【离线】Memory Generation：把"失败场景"写进 latent memory</text>

  <!-- Base Model -->
  <rect x="60" y="92" width="230" height="150" rx="8" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="175" y="114" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0d47a1">Base Model（VLM + 解码器）</text>
  <text x="175" y="134" text-anchor="middle" font-size="10.5" fill="#555">InternVL3 骨干 + Q-Former 压缩</text>
  <text x="175" y="152" text-anchor="middle" font-size="10.5" fill="#555">Trajectory Head（出 M 条轨迹）</text>
  <text x="175" y="170" text-anchor="middle" font-size="10.5" fill="#555">Score Head（打分选最优）</text>
  <text x="175" y="194" text-anchor="middle" font-size="10.5" fill="#1b5e20">输出：轨迹 τ̂</text>
  <text x="175" y="212" text-anchor="middle" font-size="10.5" fill="#1b5e20">缓存：F_lang/F_ego/𝕋̂</text>
  <text x="175" y="230" text-anchor="middle" font-size="10.5" fill="#555">（模拟器中跑一遍）</text>

  <!-- Oracle scorer -->
  <rect x="330" y="92" width="200" height="90" rx="8" fill="#fff3e0" stroke="#ef6c00"/>
  <text x="430" y="114" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#e65100">Oracle 打分器 PDM(·)</text>
  <text x="430" y="134" text-anchor="middle" font-size="10.5" fill="#555">在仿真中评估轨迹质量</text>
  <text x="430" y="152" text-anchor="middle" font-size="10.5" fill="#555">Q(τ̂) ∈ [0,1]（安全+舒适）</text>
  <text x="430" y="170" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#c62828">Q(τ̂) &lt; β → 判为失败场景</text>

  <!-- Retrieve Model -->
  <rect x="330" y="200" width="200" height="88" rx="8" fill="#ede7f6" stroke="#5e35b1"/>
  <text x="430" y="222" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#311b92">Retrieve Model</text>
  <text x="430" y="242" text-anchor="middle" font-size="10.5" fill="#555">DINOv2 + Decoupled LoRA</text>
  <text x="430" y="260" text-anchor="middle" font-size="10.5" fill="#555">Map 分支（静态路网）</text>
  <text x="430" y="278" text-anchor="middle" font-size="10.5" fill="#555">Agent 分支（动态交互）</text>

  <!-- Latent Memory -->
  <rect x="580" y="92" width="250" height="196" rx="8" fill="#fff8e1" stroke="#f9a825"/>
  <text x="705" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#f57f17">Latent Memory 𝕄</text>
  <text x="705" y="136" text-anchor="middle" font-size="10.5" fill="#555">每条记忆 = (k, x, y)：</text>
  <text x="705" y="156" text-anchor="middle" font-size="10.5" fill="#555">k：检索键（F_map, F_agent）</text>
  <text x="705" y="176" text-anchor="middle" font-size="10.5" fill="#555">x：解码器输入（F_lang, F_ego, 𝕋̂）</text>
  <text x="705" y="196" text-anchor="middle" font-size="10.5" fill="#555">y：监督标签（专家轨迹 τ, 分数 𝕊）</text>
  <text x="705" y="222" text-anchor="middle" font-size="10.5" fill="#555">去重：cosine 相似度检查</text>
  <text x="705" y="240" text-anchor="middle" font-size="10.5" fill="#555">可扩：合成数据 SimScale → 10K 条</text>
  <text x="705" y="258" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#e65100">记忆只存"失败"不存成功</text>

  <!-- 箭头 -->
  <line x1="290" y1="160" x2="330" y2="135" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="530" y1="135" x2="580" y2="160" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="290" y1="240" x2="330" y2="245" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="530" y1="245" x2="580" y2="200" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="310" y="140" text-anchor="middle" font-size="10" fill="#777">跑仿真</text>
  <text x="555" y="150" text-anchor="middle" font-size="10" fill="#777">失败则写入</text>
  <text x="555" y="235" text-anchor="middle" font-size="10" fill="#777">提键</text>

  <!-- ============ 下半：在线 Inference with TTT ============ -->
  <rect x="30" y="330" width="1120" height="280" rx="10" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="50" y="354" font-size="13" font-weight="bold" fill="#0d47a1">【在线】Inference with TTT：检索相似失败 → 场景定制微调 → 出轨迹</text>

  <!-- 当前场景 -->
  <rect x="60" y="372" width="200" height="150" rx="8" fill="#e8eaf6" stroke="#3949ab"/>
  <text x="160" y="394" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a237e">当前场景 I</text>
  <text x="160" y="416" text-anchor="middle" font-size="10.5" fill="#555">前视图像 + 指令 + 自车状态</text>
  <text x="160" y="440" text-anchor="middle" font-size="10.5" fill="#555">Base Model 出轨迹 τ̂₀</text>
  <text x="160" y="458" text-anchor="middle" font-size="10.5" fill="#555">Retrieve Model 出查询键</text>
  <text x="160" y="476" text-anchor="middle" font-size="10.5" fill="#555">(F_map,q, F_agent,q)</text>

  <!-- Trigger -->
  <rect x="300" y="372" width="170" height="84" rx="8" fill="#ffebee" stroke="#c62828"/>
  <text x="385" y="394" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b71c1c">Trigger 门控</text>
  <text x="385" y="414" text-anchor="middle" font-size="10.5" fill="#555">cosine 相似度 &gt; λ?</text>
  <text x="385" y="432" text-anchor="middle" font-size="10.5" fill="#555">λ=0.9 才触发 TTT</text>
  <text x="385" y="450" text-anchor="middle" font-size="10.5" fill="#555">否则直接返回 τ̂₀</text>

  <!-- 检索 -->
  <rect x="510" y="372" width="190" height="84" rx="8" fill="#ede7f6" stroke="#5e35b1"/>
  <text x="605" y="394" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#311b92">检索 top-k 失败</text>
  <text x="605" y="414" text-anchor="middle" font-size="10.5" fill="#555">map 级 + agent 级</text>
  <text x="605" y="432" text-anchor="middle" font-size="10.5" fill="#555">取回 x、y 用于微调</text>

  <!-- Decoupled LoRA TTT -->
  <rect x="740" y="372" width="230" height="150" rx="8" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="855" y="394" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1b5e20">Decoupled LoRA TTT</text>
  <text x="855" y="414" text-anchor="middle" font-size="10.5" fill="#555">只微调 Action Decoder 规划头</text>
  <text x="855" y="434" text-anchor="middle" font-size="10.5" fill="#555">Map 检索 → 微调静态 LoRA 分支</text>
  <text x="855" y="452" text-anchor="middle" font-size="10.5" fill="#555">Agent 检索 → 微调动态 LoRA 分支</text>
  <text x="855" y="476" text-anchor="middle" font-size="10.5" fill="#555">3 步 AdamW，lr=2e-4</text>
  <text x="855" y="494" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1b5e20">每个场景重新初始化 LoRA</text>

  <!-- 输出 -->
  <rect x="1010" y="372" width="120" height="84" rx="8" fill="#fff3e0" stroke="#ef6c00"/>
  <text x="1070" y="394" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#e65100">修正轨迹</text>
  <text x="1070" y="414" text-anchor="middle" font-size="10.5" fill="#555">路径感知分数融合</text>
  <text x="1070" y="432" text-anchor="middle" font-size="10.5" fill="#555">静态分走 Map LoRA</text>
  <text x="1070" y="450" text-anchor="middle" font-size="10.5" fill="#555">动态分走 Agent LoRA</text>

  <!-- 箭头 -->
  <line x1="260" y1="440" x2="300" y2="420" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="470" y1="414" x2="510" y2="414" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="700" y1="414" x2="740" y2="414" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="970" y1="414" x2="1010" y2="414" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 记忆回连 -->
  <line x1="705" y1="288" x2="705" y2="330" stroke="#f57f17" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="705" y="315" text-anchor="middle" font-size="10" fill="#f57f17">在线查询</text>

  <!-- 底部说明 -->
  <rect x="60" y="534" width="1070" height="58" rx="8" fill="#eeeeee" stroke="#9e9e9e"/>
  <text x="80" y="554" font-size="11" fill="#333">关键设计：</text>
  <text x="80" y="574" font-size="11" fill="#555">① 记忆只写"失败场景"（Q(τ̂)&lt;β），对应人类"越摔越会躲"；② 检索用"结构键"（路网+交互）而非语言特征；③ TTT 用低秩 LoRA 且每场景重置，只微调解码器不动骨干 → 后向仅 26.44ms。</text>
  <text x="80" y="590" font-size="11" fill="#555">效果：Navtest 94.1 PDMS / Navhard 47.0 EPDMS，超越同系 DriveVLA-W0（90.2 PDMS，用世界模型换稠密监督，本文用失败记忆换场景自适应）。</text>
</svg>