<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 750" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4A5568"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="475" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#2D3748">Flow-GRPO 代码架构与数据流</text>
  <text x="475" y="55" text-anchor="middle" font-size="12" fill="#718096">从训练脚本到模型参数的完整调用链路</text>

  <!-- Entry Point -->
  <rect x="350" y="80" width="250" height="45" rx="20" fill="#E53E3E" stroke="#C53030" stroke-width="2" filter="url(#shadow)"/>
  <text x="475" y="107" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFF">train_flux_fast.py</text>

  <!-- Down arrow -->
  <line x1="475" y1="125" x2="475" y2="165" stroke="#4A5568" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Config -->
  <rect x="350" y="170" width="250" height="40" rx="8" fill="#EBF8FF" stroke="#63B3ED" stroke-width="2" filter="url(#shadow)"/>
  <text x="475" y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#2B6CB0">config 加载</text>

  <!-- Down arrow -->
  <line x1="475" y1="210" x2="475" y2="250" stroke="#4A5568" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Three branches -->
  <line x1="475" y1="255" x2="150" y2="300" stroke="#4A5568" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="475" y1="255" x2="475" y2="300" stroke="#4A5568" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="475" y1="255" x2="800" y2="300" stroke="#4A5568" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Branch 1: Sampling -->
  <rect x="40" y="310" width="220" height="160" rx="8" fill="#F0FFF4" stroke="#68D391" stroke-width="2" filter="url(#shadow)"/>
  <text x="150" y="335" text-anchor="middle" font-size="13" font-weight="bold" fill="#276749">采样分支</text>
  <line x1="60" y1="345" x2="240" y2="345" stroke="#68D391" stroke-width="1"/>
  <text x="65" y="365" font-size="11" fill="#4A5568">1. 读 train.txt 里的 prompt</text>
  <text x="65" y="385" font-size="11" fill="#4A5568">2. T5 编码 prompt_embeds</text>
  <text x="65" y="405" font-size="11" fill="#4A5568">3. 初始化噪声 latent z₀</text>
  <text x="65" y="425" font-size="11" fill="#4A5568">4. SDE 采样（window 模式）</text>
  <text x="65" y="445" font-size="11" fill="#4A5568">5. VAE decode → 图片</text>
  <text x="65" y="465" font-size="11" fill="#4A5568">6. 记录 log_prob_old</text>

  <!-- Branch 2: Reward -->
  <rect x="365" y="310" width="220" height="160" rx="8" fill="#FFFAF0" stroke="#F6AD55" stroke-width="2" filter="url(#shadow)"/>
  <text x="475" y="335" text-anchor="middle" font-size="13" font-weight="bold" fill="#C05621">Reward 分支</text>
  <line x1="385" y1="345" x2="565" y2="345" stroke="#F6AD55" stroke-width="1"/>
  <text x="390" y="365" font-size="11" fill="#4A5568">1. 去中心化 reward 计算</text>
  <text x="390" y="385" font-size="11" fill="#4A5568">2. 支持多种 reward 函数：</text>
  <text x="400" y="405" font-size="11" fill="#4A5568">OCR / PickScore / GenEval</text>
  <text x="400" y="425" font-size="11" fill="#4A5568">美学 / gpt_fine_grained</text>
  <text x="400" y="445" font-size="11" fill="#4A5568">grounding / color 等</text>
  <text x="390" y="465" font-size="11" fill="#4A5568">3. 输出：图片 + 对应 reward</text>

  <!-- Branch 3: Stat + Loss -->
  <rect x="690" y="310" width="220" height="160" rx="8" fill="#FAF5FF" stroke="#B794F4" stroke-width="2" filter="url(#shadow)"/>
  <text x="800" y="335" text-anchor="middle" font-size="13" font-weight="bold" fill="#6B46C1">统计 &amp; 损失分支</text>
  <line x1="710" y1="345" x2="890" y2="345" stroke="#B794F4" stroke-width="1"/>
  <text x="715" y="365" font-size="11" fill="#4A5568">1. gather 所有 GPU 的 reward</text>
  <text x="715" y="385" font-size="11" fill="#4A5568">2. PerPromptStatTracker:</text>
  <text x="725" y="405" font-size="11" fill="#4A5568">μ, σ → advantage</text>
  <text x="715" y="425" font-size="11" fill="#4A5568">3. 计算 PPO-style loss:</text>
  <text x="725" y="445" font-size="11" fill="#4A5568">ratio × advantage + KL</text>
  <text x="715" y="465" font-size="11" fill="#4A5568">4. backward() → optimizer</text>

  <!-- Merge arrows -->
  <path d="M260,430 Q310,430 310,510 Q310,560 475,560" fill="none" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M585,430 Q620,430 620,510 Q620,560 475,560" fill="none" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M690,430 Q640,430 640,510 Q640,560 475,560" fill="none" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Sync point -->
  <rect x="350" y="565" width="250" height="40" rx="20" fill="#805AD5" stroke="#6B46C1" stroke-width="2" filter="url(#shadow)"/>
  <text x="475" y="590" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFF">all_gather / 同步</text>

  <!-- Key classes -->
  <rect x="40" y="510" width="220" height="40" rx="8" fill="#EBF8FF" stroke="#63B3ED" stroke-width="1.5"/>
  <text x="150" y="530" text-anchor="middle" font-size="10" font-weight="bold" fill="#2B6CB0">cond. encode_prompt()</text>
  <text x="150" y="544" text-anchor="middle" font-size="9" fill="#718096">prompt → prompt_embeds</text>

  <rect x="690" y="510" width="220" height="40" rx="8" fill="#FFF5F5" stroke="#FC8181" stroke-width="1.5"/>
  <text x="800" y="530" text-anchor="middle" font-size="10" font-weight="bold" fill="#C53030">PerPromptStatTracker</text>
  <text x="800" y="544" text-anchor="middle" font-size="9" fill="#718096">reward → advantage</text>

  <!-- File list at bottom -->
  <text x="475" y="630" text-anchor="middle" font-size="14" font-weight="bold" fill="#2D3748">核心代码文件映射</text>
  <line x1="100" y1="640" x2="850" y2="640" stroke="#CBD5E0" stroke-width="1"/>

  <rect x="40" y="655" width="135" height="35" rx="6" fill="#EDF2F7" stroke="#A0AEC0" stroke-width="1"/>
  <text x="107" y="670" text-anchor="middle" font-size="9" font-weight="bold" fill="#2D3748">scripts/train*.py</text>
  <text x="107" y="683" text-anchor="middle" font-size="8" fill="#718096">主循环</text>

  <rect x="190" y="655" width="135" height="35" rx="6" fill="#EDF2F7" stroke="#A0AEC0" stroke-width="1"/>
  <text x="257" y="670" text-anchor="middle" font-size="9" font-weight="bold" fill="#2D3748">config/grpo.py</text>
  <text x="257" y="683" text-anchor="middle" font-size="8" fill="#718096">实验配置</text>

  <rect x="340" y="655" width="135" height="35" rx="6" fill="#EDF2F7" stroke="#A0AEC0" stroke-width="1"/>
  <text x="407" y="670" text-anchor="middle" font-size="9" font-weight="bold" fill="#2D3748">flow_grpo/rewards.py</text>
  <text x="407" y="683" text-anchor="middle" font-size="8" fill="#718096">奖励函数</text>

  <rect x="490" y="655" width="135" height="35" rx="6" fill="#EDF2F7" stroke="#A0AEC0" stroke-width="1"/>
  <text x="557" y="670" text-anchor="middle" font-size="9" font-weight="bold" fill="#2D3748">flow_grpo/stat*.py</text>
  <text x="557" y="683" text-anchor="middle" font-size="8" fill="#718096">Advantage</text>

  <rect x="640" y="655" width="135" height="35" rx="6" fill="#EDF2F7" stroke="#A0AEC0" stroke-width="1"/>
  <text x="707" y="670" text-anchor="middle" font-size="9" font-weight="bold" fill="#2D3748">diffusers_patch/*</text>
  <text x="707" y="683" text-anchor="middle" font-size="8" fill="#718096">SDE + log_p</text>

  <rect x="790" y="655" width="135" height="35" rx="6" fill="#EDF2F7" stroke="#A0AEC0" stroke-width="1"/>
  <text x="857" y="670" text-anchor="middle" font-size="9" font-weight="bold" fill="#2D3748">config/base.py</text>
  <text x="857" y="683" text-anchor="middle" font-size="8" fill="#718096">默认参数</text>
</svg>
