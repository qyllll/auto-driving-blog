<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4A5568"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#3182CE"/>
    </marker>
    <linearGradient id="g-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EBF8FF"/>
      <stop offset="100%" stop-color="#BEE3F8"/>
    </linearGradient>
    <linearGradient id="g-green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0FFF4"/>
      <stop offset="100%" stop-color="#C6F6D5"/>
    </linearGradient>
    <linearGradient id="g-orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFAF0"/>
      <stop offset="100%" stop-color="#FEEBC8"/>
    </linearGradient>
    <linearGradient id="g-purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAF5FF"/>
      <stop offset="100%" stop-color="#E9D8FD"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="500" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#2D3748">概念关系：五个名词怎么拼成 Flow-GRPO</text>
  <text x="500" y="60" text-anchor="middle" font-size="12" fill="#718096">两条主线（怎么生成 × 怎么改进）+ 一个裁判（奖励模型）</text>

  <!-- Row 1: generator (blue) -->
  <rect x="80" y="100" width="250" height="64" rx="10" fill="url(#g-blue)" stroke="#3182CE" stroke-width="2" filter="url(#shadow)"/>
  <text x="205" y="126" text-anchor="middle" font-size="14" font-weight="bold" fill="#2B6CB0">① 扩散模型</text>
  <text x="205" y="148" text-anchor="middle" font-size="11.5" fill="#4A5568">生成模型家族：噪声 → 图片</text>

  <rect x="390" y="100" width="250" height="64" rx="10" fill="url(#g-blue)" stroke="#3182CE" stroke-width="2" filter="url(#shadow)"/>
  <text x="515" y="126" text-anchor="middle" font-size="14" font-weight="bold" fill="#2B6CB0">② Flow Matching</text>
  <text x="515" y="148" text-anchor="middle" font-size="11.5" fill="#4A5568">扩散的「直连版」：学速度场</text>

  <rect x="700" y="100" width="250" height="64" rx="10" fill="url(#g-blue)" stroke="#3182CE" stroke-width="2" filter="url(#shadow)"/>
  <text x="825" y="126" text-anchor="middle" font-size="14" font-weight="bold" fill="#2B6CB0">③ FLUX.1-dev</text>
  <text x="825" y="148" text-anchor="middle" font-size="11.5" fill="#4A5568">用到的具体生成模型</text>

  <line x1="330" y1="132" x2="386" y2="132" stroke="#4A5568" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="132" x2="696" y2="132" stroke="#4A5568" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 2: reward (orange) -->
  <rect x="390" y="220" width="250" height="64" rx="10" fill="url(#g-orange)" stroke="#DD6B20" stroke-width="2" filter="url(#shadow)"/>
  <text x="515" y="246" text-anchor="middle" font-size="14" font-weight="bold" fill="#C05621">奖励模型（裁判）</text>
  <text x="515" y="268" text-anchor="middle" font-size="11.5" fill="#4A5568">OCR / GenEval / PickScore</text>

  <line x1="825" y1="164" x2="825" y2="216" stroke="#DD6B20" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <text x="845" y="194" font-size="11" fill="#C05621">生成图</text>
  <text x="845" y="208" font-size="11" fill="#C05621">去打分</text>

  <!-- Row 3: learning algorithm (purple) -->
  <rect x="80" y="340" width="250" height="64" rx="10" fill="url(#g-purple)" stroke="#805AD5" stroke-width="2" filter="url(#shadow)"/>
  <text x="205" y="366" text-anchor="middle" font-size="14" font-weight="bold" fill="#6B46C1">④ GRPO</text>
  <text x="205" y="388" text-anchor="middle" font-size="11.5" fill="#4A5568">学习算法：组内竞争</text>

  <rect x="390" y="340" width="250" height="64" rx="10" fill="url(#g-purple)" stroke="#805AD5" stroke-width="2" filter="url(#shadow)"/>
  <text x="515" y="366" text-anchor="middle" font-size="14" font-weight="bold" fill="#6B46C1">⑤ Advantage</text>
  <text x="515" y="388" text-anchor="middle" font-size="11.5" fill="#4A5568">组内归一化后的学习信号</text>

  <rect x="700" y="340" width="250" height="64" rx="10" fill="url(#g-purple)" stroke="#805AD5" stroke-width="2" filter="url(#shadow)"/>
  <text x="825" y="366" text-anchor="middle" font-size="14" font-weight="bold" fill="#6B46C1">⑥ PPO Loss</text>
  <text x="825" y="388" text-anchor="middle" font-size="11.5" fill="#4A5568">让高分走法的概率上升</text>

  <line x1="330" y1="372" x2="386" y2="372" stroke="#4A5568" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="372" x2="696" y2="372" stroke="#4A5568" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="515" y1="284" x2="515" y2="336" stroke="#DD6B20" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- PPO -> fusion -->
  <line x1="825" y1="404" x2="825" y2="466" stroke="#805AD5" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Fusion box -->
  <rect x="150" y="470" width="700" height="90" rx="12" fill="url(#g-green)" stroke="#38A169" stroke-width="2" filter="url(#shadow)"/>
  <text x="500" y="497" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#276749">Flow-GRPO = 用 GRPO（在线强化学习）训练 Flow Matching 生成模型</text>
  <text x="500" y="520" text-anchor="middle" font-size="11.5" fill="#4A5568">采样阶段：FLUX 沿速度场生成图片（记 log_prob_old）→ 奖励模型打分 → 组内归一化成 advantage</text>
  <text x="500" y="541" text-anchor="middle" font-size="11.5" fill="#4A5568">训练阶段：用 PPO Loss 让「高分走法」概率上升 → 回到采样，循环直到模型变好</text>

  <!-- Legend -->
  <rect x="80" y="595" width="260" height="46" rx="8" fill="url(#g-blue)" stroke="#3182CE" stroke-width="1.5"/>
  <text x="210" y="623" text-anchor="middle" font-size="12" font-weight="bold" fill="#2B6CB0">蓝色 = 生成器：决定「怎么生成」</text>

  <rect x="370" y="595" width="260" height="46" rx="8" fill="url(#g-orange)" stroke="#DD6B20" stroke-width="1.5"/>
  <text x="500" y="623" text-anchor="middle" font-size="12" font-weight="bold" fill="#C05621">橙色 = 裁判：决定「什么算好」</text>

  <rect x="660" y="595" width="260" height="46" rx="8" fill="url(#g-purple)" stroke="#805AD5" stroke-width="1.5"/>
  <text x="790" y="623" text-anchor="middle" font-size="12" font-weight="bold" fill="#6B46C1">紫色 = 学习算法：决定「怎么改」</text>
</svg>
