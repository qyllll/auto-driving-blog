<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4A5568"/>
    </marker>
    <marker id="arrow-down" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L5,10 L10,0 Z" fill="#4A5568"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#2D3748">Flow Matching 去噪过程（推理/采样）</text>
  <text x="450" y="55" text-anchor="middle" font-size="12" fill="#718096">从纯噪声到最终图像的连续时间轨迹生成</text>

  <!-- Time axis -->
  <line x1="80" y1="120" x2="820" y2="120" stroke="#CBD5E0" stroke-width="3"/>
  
  <!-- t=0 -->
  <circle cx="100" cy="120" r="6" fill="#E53E3E"/>
  <text x="100" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#C53030">t=0</text>
  <text x="100" y="105" text-anchor="middle" font-size="10" fill="#718096">纯噪声</text>

  <!-- t=T -->
  <circle cx="800" cy="120" r="6" fill="#38A169"/>
  <text x="800" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#276749">t=1</text>
  <text x="800" y="105" text-anchor="middle" font-size="10" fill="#718096">最终图片</text>

  <!-- Intermediate timestamps -->
  <circle cx="250" cy="120" r="4" fill="#A0AEC0"/>
  <text x="250" y="140" text-anchor="middle" font-size="10" fill="#718096">t₁</text>
  <circle cx="400" cy="120" r="4" fill="#A0AEC0"/>
  <text x="400" y="140" text-anchor="middle" font-size="10" fill="#718096">t₂</text>
  <circle cx="550" cy="120" r="4" fill="#A0AEC0"/>
  <text x="550" y="140" text-anchor="middle" font-size="10" fill="#718096">t₃</text>
  <circle cx="680" cy="120" r="4" fill="#A0AEC0"/>
  <text x="680" y="140" text-anchor="middle" font-size="10" fill="#718096">t₄</text>

  <!-- What is x_t at each step -->
  <rect x="120" y="170" width="130" height="45" rx="8" fill="#FFF5F5" stroke="#FC8181" stroke-width="2" filter="url(#shadow)"/>
  <text x="185" y="192" text-anchor="middle" font-size="11" font-weight="bold" fill="#C53030">x₀ = N(0,I)</text>
  <text x="185" y="207" text-anchor="middle" font-size="9" fill="#718096">采样初始噪声</text>

  <rect x="270" y="170" width="130" height="45" rx="8" fill="#FFFAF0" stroke="#F6AD55" stroke-width="2" filter="url(#shadow)"/>
  <text x="335" y="192" text-anchor="middle" font-size="11" font-weight="bold" fill="#C05621">x₁ = x₀ + v·Δt</text>
  <text x="335" y="207" text-anchor="middle" font-size="9" fill="#718096">网络预测速度 v</text>

  <rect x="420" y="170" width="130" height="45" rx="8" fill="#FFFAF0" stroke="#F6AD55" stroke-width="2" filter="url(#shadow)"/>
  <text x="485" y="192" text-anchor="middle" font-size="11" font-weight="bold" fill="#C05621">x₂ = x₁ + v·Δt</text>
  <text x="485" y="207" text-anchor="middle" font-size="9" fill="#718096">逐步去噪</text>

  <rect x="570" y="170" width="130" height="45" rx="8" fill="#FFFAF0" stroke="#F6AD55" stroke-width="2" filter="url(#shadow)"/>
  <text x="635" y="192" text-anchor="middle" font-size="11" font-weight="bold" fill="#C05621">……不断推进</text>
  <text x="635" y="207" text-anchor="middle" font-size="9" fill="#718096">共 10 步（默认）</text>

  <rect x="720" y="170" width="130" height="45" rx="8" fill="#F0FFF4" stroke="#68D391" stroke-width="2" filter="url(#shadow)"/>
  <text x="785" y="192" text-anchor="middle" font-size="11" font-weight="bold" fill="#276749">x_T = 最终图片</text>
  <text x="785" y="207" text-anchor="middle" font-size="9" fill="#718096">带 prompt 条件的</text>

  <!-- Arrows between boxes -->
  <line x1="250" y1="192" x2="268" y2="192" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="192" x2="418" y2="192" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="550" y1="192" x2="568" y2="192" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="700" y1="192" x2="718" y2="192" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Mathematical framework -->
  <rect x="100" y="250" width="700" height="140" rx="10" fill="#F7FAFC" stroke="#CBD5E0" stroke-width="1.5"/>
  <text x="450" y="275" text-anchor="middle" font-size="13" font-weight="bold" fill="#2D3748">Flow Matching 数学框架</text>

  <text x="120" y="300" font-size="11" fill="#4A5568">目标：学习一个时间无关的向量场 v_θ(x, t, prompt)，使得：</text>
  <text x="170" y="322" font-size="12" font-style="italic" fill="#C53030">d x_t / dt = v_θ(x_t, t, prompt)</text>
  <text x="120" y="345" font-size="11" fill="#4A5568">其中：</text>
  <text x="170" y="365" font-size="11" fill="#4A5568">• 训练时：已知 x₀ → x₁ 的线性轨迹，直接监督速度 v 的预测</text>
  <text x="170" y="383" font-size="11" fill="#4A5568">• 推理时：从 x₀ ~ N(0,I) 出发，沿预测速度积分到 x_T</text>

  <!-- SDE sampling -->
  <rect x="100" y="410" width="700" height="120" rx="10" fill="#FAF5FF" stroke="#B794F4" stroke-width="1.5"/>
  <text x="450" y="435" text-anchor="middle" font-size="13" font-weight="bold" fill="#6B46C1">SDE 采样（Flow-GRPO 使用的推理模式）</text>

  <text x="120" y="460" font-size="11" fill="#4A5568">训练时并不直接去噪，而是用 SDE 从噪声生成图片：</text>
  <text x="170" y="482" font-size="12" font-style="italic" fill="#805AD5">d x_t = v_θ(x_t, t, prompt) dt + g(t) dW_t</text>
  <text x="120" y="505" font-size="11" fill="#4A5568">• v_θ 项：确定性速度（模型预测）→ 控制图片内容</text>
  <text x="120" y="523" font-size="11" fill="#4A5568">• g(t) dW_t 项：随机噪声注入 → 增加多样性</text>

  <!-- Flux model bottom -->
  <rect x="150" y="560" width="600" height="60" rx="10" fill="#EBF8FF" stroke="#63B3ED" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="585" text-anchor="middle" font-size="13" font-weight="bold" fill="#2B6CB0">Flux.1-dev 模型内部：DiT (Diffusion Transformer)</text>
  <text x="450" y="605" text-anchor="middle" font-size="11" fill="#4A5568">double_stream → single_stream → 输出速度 v_θ(x_t, t, prompt_embeds)</text>

  <!-- Key concept callout -->
  <rect x="780" y="410" width="110" height="100" rx="8" fill="#FFF5F5" stroke="#FC8181" stroke-width="1.5"/>
  <text x="835" y="432" text-anchor="middle" font-size="10" font-weight="bold" fill="#C53030">⚠️ 关键区别</text>
  <text x="790" y="452" font-size="10" fill="#4A5568">Flow=速度 v</text>
  <text x="790" y="468" font-size="10" fill="#4A5568">DDPM=噪声 ε</text>
  <text x="790" y="488" font-size="10" fill="#4A5568">Flow 轨迹是</text>
  <text x="790" y="504" font-size="10" fill="#4A5568">线性插值</text>
</svg>
