  <text x="66" y="92" font-size="15" font-weight="bold" fill="#FFF">flow_grpo/</text>
  <text x="320" y="83" font-size="12" fill="#718096">仓库根目录（6 大目录 + 说明文件）</text>
  <text x="70" y="118" font-size="12.5" font-weight="normal" fill="#A0AEC0">  README.md</text>
  <text x="560" y="118" font-size="12" fill="#718096">使用说明与各模型配置指南</text>
  <text x="70" y="155" font-size="12.5" font-weight="normal" fill="#A0AEC0">  LICENSE · setup.py</text>
  <text x="560" y="155" font-size="12" fill="#718096">开源许可 · 包安装配置</text>
  <text x="70" y="192" font-size="13" font-weight="bold" fill="#3182CE">scripts/</text>
  <text x="560" y="192" font-size="12" fill="#718096">★ 可执行训练脚本（启动入口）</text>
  <text x="100" y="229" font-size="13" font-weight="bold" fill="#E53E3E">train_flux_fast.py</text>
  <text x="560" y="229" font-size="12" fill="#718096">★ 主训练：GRPO + SDE 窗口加速</text>
  <text x="100" y="266" font-size="13" font-weight="bold" fill="#4A5568">train_flux.py</text>
  <text x="560" y="266" font-size="12" fill="#718096">基础版：全部 timestep 参与训练</text>
  <text x="100" y="303" font-size="12.5" font-weight="normal" fill="#4A5568">train_sd3_fast.py · train_sd3.py</text>
  <text x="560" y="303" font-size="12" fill="#718096">SD3 的 fast / 基础版</text>
  <text x="100" y="340" font-size="12.5" font-weight="normal" fill="#4A5568">train_qwenimage.py · train_qwenimage_edit.py</text>
  <text x="560" y="340" font-size="12" fill="#718096">Qwen-Image 版本</text>
  <text x="100" y="377" font-size="12.5" font-weight="normal" fill="#4A5568">train_bagel.py · train_wan2_1.py</text>
  <text x="560" y="377" font-size="12" fill="#718096">Bagel / Wan2.1 版本</text>
  <text x="100" y="414" font-size="12.5" font-weight="normal" fill="#4A5568">train_sd3_dpo.py · train_sd3_sft.py</text>
  <text x="560" y="414" font-size="12" fill="#718096">DPO / SFT 训练变体</text>
  <text x="100" y="451" font-size="12.5" font-weight="normal" fill="#4A5568">train_sd3_GRPO_Guard.py</text>
  <text x="560" y="451" font-size="12" fill="#718096">GRPO-Guard 安全微调</text>
  <text x="100" y="488" font-size="12.5" font-weight="normal" fill="#718096">multi_node/ · single_node/ · accelerate_configs/</text>
  <text x="560" y="488" font-size="12" fill="#718096">分布式启动配置</text>
  <text x="70" y="525" font-size="13" font-weight="bold" fill="#DD6B20">config/</text>
  <text x="560" y="525" font-size="12" fill="#718096">配置文件</text>
  <text x="100" y="562" font-size="13" font-weight="bold" fill="#C05621">base.py</text>
  <text x="560" y="562" font-size="12" fill="#718096">全部默认超参数（num_steps=40 等）</text>
  <text x="100" y="599" font-size="13" font-weight="bold" fill="#C05621">grpo.py</text>
  <text x="560" y="599" font-size="12" fill="#718096">GRPO 实验配方：OCR / GenEval / PickScore…</text>
  <text x="100" y="636" font-size="12.5" font-weight="normal" fill="#C05621">dpo.py · sft.py · grpo_guard.py</text>
  <text x="560" y="636" font-size="12" fill="#718096">DPO / SFT / Guard 配方</text>
  <text x="70" y="673" font-size="13" font-weight="bold" fill="#38A169">dataset/</text>
  <text x="560" y="673" font-size="12" fill="#718096">Prompt 数据集</text>
  <text x="100" y="710" font-size="12.5" font-weight="normal" fill="#276749">ocr/ · drawbench/</text>
  <text x="560" y="710" font-size="12" fill="#718096">txt 格式（每行一个 prompt）</text>
  <text x="100" y="747" font-size="12.5" font-weight="normal" fill="#276749">geneval/ · geneval_unseen_objects/</text>
  <text x="560" y="747" font-size="12" fill="#718096">jsonl 元数据格式</text>
  <text x="100" y="784" font-size="12.5" font-weight="normal" fill="#276749">pickscore/ · pickscore_sfw/ · counting_edit/</text>
  <text x="560" y="784" font-size="12" fill="#718096">PickScore / 计数编辑数据</text>
  <rect x="50" y="808" width="250" height="25" rx="8" fill="#2D3748" filter="url(#shadow)"/>
  <text x="66" y="832" font-size="15" font-weight="bold" fill="#FFF">flow_grpo/</text>
  <text x="320" y="823" font-size="12" fill="#718096">★ 核心库（被 scripts 调用）</text>
  <text x="100" y="858" font-size="13" font-weight="bold" fill="#6B46C1">rewards.py</text>
  <text x="560" y="858" font-size="12" fill="#718096">★ reward 函数库（多 reward 组合）</text>
  <text x="100" y="895" font-size="13" font-weight="bold" fill="#6B46C1">stat_tracking.py</text>
  <text x="560" y="895" font-size="12" fill="#718096">★ PerPromptStatTracker → advantage</text>
  <text x="100" y="932" font-size="12.5" font-weight="normal" fill="#6B46C1">ema.py · fsdp_utils.py</text>
  <text x="560" y="932" font-size="12" fill="#718096">EMA 参数快照 · FSDP 分片</text>
  <text x="100" y="969" font-size="12.5" font-weight="normal" fill="#6B46C1">prompts.py · ocr.py</text>
  <text x="560" y="969" font-size="12" fill="#718096">prompt 模板 · OCR 识别器</text>
  <text x="100" y="1006" font-size="12.5" font-weight="normal" fill="#6B46C1">clip_scorer · pickscore_scorer · aesthetic_scorer</text>
  <text x="560" y="1006" font-size="12" fill="#718096">CLIP / PickScore / 美学评分器</text>
  <text x="100" y="1043" font-size="12.5" font-weight="normal" fill="#6B46C1">imagereward_scorer · qwenvl</text>
  <text x="560" y="1043" font-size="12" fill="#718096">ImageReward / Qwen-VL 评分器</text>
  <text x="100" y="1080" font-size="13" font-weight="bold" fill="#6B46C1">diffusers_patch/</text>
  <text x="560" y="1080" font-size="12" fill="#718096">★ 改写采样器：带 log_prob 的 SDE</text>
  <text x="130" y="1117" font-size="13" font-weight="bold" fill="#E53E3E">flux_pipeline_with_logprob_fast.py</text>
  <text x="660" y="1117" font-size="12" fill="#718096">★ fast 版：SDE 窗口采样</text>
  <text x="130" y="1154" font-size="12.5" font-weight="normal" fill="#4A5568">flux_pipeline_with_logprob.py</text>
  <text x="660" y="1154" font-size="12" fill="#718096">基础版：全步 SDE 采样</text>
  <text x="130" y="1191" font-size="13" font-weight="bold" fill="#E53E3E">sd3_sde_with_logprob.py</text>
  <text x="660" y="1191" font-size="12" fill="#718096">★ 单步 SDE + log_prob 计算</text>
  <text x="130" y="1228" font-size="12.5" font-weight="normal" fill="#718096">sd3_pipeline_with_logprob(_fast).py</text>
  <text x="660" y="1228" font-size="12" fill="#718096">SD3 版本采样器</text>
  <text x="130" y="1265" font-size="12.5" font-weight="normal" fill="#718096">qwenimage_*.py · wan_pipeline_with_logprob.py</text>
  <text x="660" y="1265" font-size="12" fill="#718096">Qwen-Image / Wan 版本</text>
  <text x="130" y="1302" font-size="12.5" font-weight="normal" fill="#718096">train_dreambooth_lora_*.py</text>
  <text x="660" y="1302" font-size="12" fill="#718096">LoRA 微调工具</text>
  <rect x="40" y="1328" width="1000" height="68" rx="8" fill="#EBF8FF" stroke="#63B3ED" stroke-width="1.5"/>
  <text x="60" y="1352" font-size="12.5" font-weight="bold" fill="#2B6CB0">fast 与基础版（train_flux_fast.py vs train_flux.py）的本质区别：</text>
  <text x="60" y="1374" font-size="11" fill="#4A5568">基础版 flux_pipeline_with_logprob.py：全部 40 个 timestep 都记录梯度 → 计算图大、显存高、慢。</text>
  <text x="60" y="1388" font-size="11" fill="#4A5568">fast 版 flux_pipeline_with_logprob_fast.py：只对 SDE 窗口内 sde_window_size 个 timestep 记录梯度，其余走确定性 ODE → 显存小、更快。</text>
</svg>