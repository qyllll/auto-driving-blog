<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" font-family="'Noto Sans SC','Microsoft YaHei','Fira Code',monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4A5568"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <text x="440" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#2D3748">flow_grpo/ 代码仓库结构</text>

  <!-- Root -->
  <rect x="20" y="60" width="200" height="40" rx="8" fill="#2D3748" stroke="#1A202C" stroke-width="2" filter="url(#shadow)"/>
  <text x="120" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFF">flow_grpo/</text>

  <line x1="120" y1="100" x2="120" y2="130" stroke="#4A5568" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="120" y1="118" x2="330" y2="118" stroke="#4A5568" stroke-width="2"/>
  <line x1="120" y1="118" x2="480" y2="118" stroke="#4A5568" stroke-width="2"/>
  <line x1="120" y1="118" x2="650" y2="118" stroke="#4A5568" stroke-width="2"/>

  <!-- scripts/ -->
  <rect x="230" y="140" width="200" height="40" rx="8" fill="#EBF8FF" stroke="#63B3ED" stroke-width="2" filter="url(#shadow)"/>
  <text x="330" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#2B6CB0">scripts/</text>
  <text x="330" y="174" text-anchor="middle" font-size="9" fill="#718096">可执行脚本 · 从这里启动训练</text>

  <line x1="330" y1="180" x2="330" y2="205" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="190" y="210" width="280" height="150" rx="8" fill="#F7FAFC" stroke="#CBD5E0" stroke-width="1"/>
  <rect x="205" y="222" width="250" height="26" rx="5" fill="#FFF" stroke="#63B3ED" stroke-width="1.5"/>
  <text x="215" y="240" font-size="10" font-weight="bold" fill="#2B6CB0">train_flux_fast.py</text>
  <text x="440" y="240" font-size="10" fill="#718096">主训练脚本</text>
  <rect x="205" y="254" width="250" height="26" rx="5" fill="#FFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="215" y="272" font-size="10" fill="#4A5568">train_flux.py</text>
  <text x="440" y="272" font-size="10" fill="#A0AEC0">基础版训练</text>
  <rect x="205" y="286" width="250" height="26" rx="5" fill="#FFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="215" y="304" font-size="10" fill="#4A5568">train_sd3_fast.py</text>
  <text x="440" y="304" font-size="10" fill="#A0AEC0">SD3 模型版本</text>
  <rect x="205" y="318" width="250" height="26" rx="5" fill="#FFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="215" y="336" font-size="10" fill="#4A5568">train_qwen_image_fast.py</text>
  <text x="440" y="336" font-size="10" fill="#A0AEC0">Qwen-Image 版本</text>

  <!-- config/ -->
  <rect x="380" y="140" width="200" height="40" rx="8" fill="#FFFAF0" stroke="#F6AD55" stroke-width="2" filter="url(#shadow)"/>
  <text x="480" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#C05621">config/</text>
  <text x="480" y="174" text-anchor="middle" font-size="9" fill="#718096">配置文件</text>

  <line x1="480" y1="180" x2="480" y2="205" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="395" y="210" width="170" height="80" rx="8" fill="#F7FAFC" stroke="#CBD5E0" stroke-width="1"/>
  <rect x="410" y="222" width="140" height="26" rx="5" fill="#FFF" stroke="#F6AD55" stroke-width="1.5"/>
  <text x="420" y="240" font-size="10" font-weight="bold" fill="#C05621">base.py</text>
  <text x="545" y="240" font-size="10" fill="#A0AEC0">默认超参数</text>
  <rect x="410" y="254" width="140" height="26" rx="5" fill="#FFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="420" y="272" font-size="10" fill="#4A5568">grpo.py</text>
  <text x="545" y="272" font-size="10" fill="#A0AEC0">实验配方</text>

  <!-- flow_grpo/ core -->
  <rect x="550" y="140" width="310" height="40" rx="8" fill="#FAF5FF" stroke="#B794F4" stroke-width="2" filter="url(#shadow)"/>
  <text x="705" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#6B46C1">flow_grpo/（核心库）</text>
  <text x="705" y="174" text-anchor="middle" font-size="9" fill="#718096">被 scripts 调用的全部逻辑</text>

  <line x1="705" y1="180" x2="705" y2="205" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="560" y="210" width="290" height="200" rx="8" fill="#F7FAFC" stroke="#CBD5E0" stroke-width="1"/>
  <rect x="575" y="222" width="260" height="26" rx="5" fill="#FFF" stroke="#B794F4" stroke-width="1.5"/>
  <text x="585" y="240" font-size="10" font-weight="bold" fill="#6B46C1">rewards.py</text>
  <text x="815" y="240" font-size="10" fill="#718096">reward 函数库</text>
  <rect x="575" y="254" width="260" height="26" rx="5" fill="#FFF" stroke="#B794F4" stroke-width="1.5"/>
  <text x="585" y="272" font-size="10" font-weight="bold" fill="#6B46C1">stat_tracking.py</text>
  <text x="815" y="272" font-size="10" fill="#718096">advantage 计算</text>
  <rect x="575" y="286" width="260" height="26" rx="5" fill="#FFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="585" y="304" font-size="10" fill="#4A5568">ema.py / fsdp_utils.py</text>
  <text x="815" y="304" font-size="10" fill="#A0AEC0">EMA / 分布式分片</text>
  <rect x="575" y="318" width="260" height="26" rx="5" fill="#FFF" stroke="#B794F4" stroke-width="1.5"/>
  <text x="585" y="336" font-size="10" font-weight="bold" fill="#6B46C1">diffusers_patch/</text>
  <text x="815" y="336" font-size="10" fill="#718096">SDE 采样 + log_prob</text>
  <line x1="620" y1="344" x2="620" y2="360" stroke="#4A5568" stroke-width="1"/>
  <rect x="590" y="362" width="230" height="22" rx="5" fill="#FFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="600" y="377" font-size="9" fill="#4A5568">flux_pipeline_with_logprob_fast.py</text>
  <rect x="590" y="388" width="230" height="22" rx="5" fill="#FFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="600" y="403" font-size="9" fill="#4A5568">sd3_sde_with_logprob.py</text>

  <!-- Bottom legend -->
  <rect x="20" y="440" width="840" height="60" rx="8" fill="#EBF8FF" stroke="#63B3ED" stroke-width="1.5"/>
  <text x="40" y="462" font-size="11" font-weight="bold" fill="#2B6CB0">读代码的顺序建议：</text>
  <text x="40" y="482" font-size="10" fill="#4A5568">1. 先看 scripts/train_flux_fast.py（主线）→ 2. 遇到调用的模块再跳到 flow_grpo/ 对应文件 → 3. 用 config/ 里的参数验证理解</text>
</svg>
