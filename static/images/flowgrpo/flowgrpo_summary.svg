<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4A5568"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#E53E3E"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#3182CE"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.14"/>
    </filter>
  </defs>

  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2D3748">Flow-GRPO 一图串通：从「学速度」到「参数更新」的完整逻辑链</text>
  <text x="500" y="52" text-anchor="middle" font-size="12" fill="#718096">每个节点 = 一个环节 + 它的核心公式 + 为什么非要这么做</text>

  <!-- ===== Node 1: FM 训练 ===== -->
  <rect x="150" y="75" width="700" height="72" rx="10" fill="#EBF8FF" stroke="#3182CE" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="100" font-size="14" font-weight="bold" fill="#2B6CB0">① 训练 Flow Matching＝学会"速度" v_θ</text>
  <text x="180" y="120" font-size="11" fill="#4A5568">网络输入 (x_t, t, prompt)，输出"该往哪走的瞬时速度"</text>
  <text x="180" y="138" font-size="11" fill="#4A5568"><tspan fill="#2B6CB0" font-weight="bold">CFM 损失：</tspan>L = E‖v_θ(x_t,t,c) − (x₁−x₀)‖²  （学到从噪声指向图片的直线速度场）</text>

  <line x1="500" y1="147" x2="500" y2="172" stroke="#4A5568" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ===== Node 2: 采样要概率 → SDE ===== -->
  <rect x="150" y="178" width="700" height="72" rx="10" fill="#E6FFFA" stroke="#38A169" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="203" font-size="14" font-weight="bold" fill="#276749">② 采样要"概率"，所以 ODE→SDE</text>
  <text x="180" y="223" font-size="11" fill="#4A5568">纯 ODE 是确定性"复印机"→ 没有可微的 logπ → 策略梯度无梯可导</text>
  <text x="180" y="241" font-size="11" fill="#4A5568"><tspan fill="#276749" font-weight="bold">给同一 v_θ 加噪声：</tspan>dx = v_θ dt + g(t) dW   → 单步变成"从高斯里抽" → 有随机性、有概率</text>

  <line x1="500" y1="250" x2="500" y2="275" stroke="#4A5568" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ===== Node 3: log p ===== -->
  <rect x="150" y="281" width="700" height="64" rx="10" fill="#F0FFF4" stroke="#2F855A" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="306" font-size="14" font-weight="bold" fill="#276749">③ SDE 单步是高斯核 → log p 有闭式解</text>
  <text x="180" y="326" font-size="11" fill="#4A5568">log p(x_{k+1}|x_k) = −‖x_{k+1}−mean‖²/(2σ²(−Δt)) − log(σ√(−Δt)) − log√(2π)</text>
  <text x="180" y="338" font-size="11" fill="#718096">（标准差 σ=σ_noise√(−Δt)，mean 是带修正的 Euler 步）</text>

  <line x1="500" y1="345" x2="500" y2="370" stroke="#4A5568" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ===== Node 4: π(τ) ===== -->
  <rect x="150" y="376" width="700" height="64" rx="10" fill="#FFFAF0" stroke="#DD6B20" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="401" font-size="14" font-weight="bold" fill="#C05621">④ 整条轨迹的概率 = 各步连乘（马尔可夫）</text>
  <text x="180" y="421" font-size="11" fill="#4A5568">π_θ(τ) = p(x₀)·Π p(x_{k+1}|x_k)(SDE 高斯核)  → PPO ratio 要的就是它</text>
  <text x="180" y="433" font-size="11" fill="#718096">采样阶段记录 log_prob_old；训练阶段重算 log_prob_new</text>

  <line x1="500" y1="440" x2="500" y2="465" stroke="#4A5568" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ===== Node 5: reward + advantage ===== -->
  <rect x="150" y="471" width="700" height="72" rx="10" fill="#FAF5FF" stroke="#805AD5" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="496" font-size="14" font-weight="bold" fill="#6B46C1">⑤ 打分 → 组内归一化成 Advantage</text>
  <text x="180" y="516" font-size="11" fill="#4A5568">同一 prompt 生成 G 张图 → reward r → 组内均值/标准差归一化</text>
  <text x="180" y="534" font-size="11" fill="#4A5568"><tspan fill="#6B46C1" font-weight="bold">A_i = (r_i − μ)/σ</tspan>  再 clip 到 ±2 → 替代 critic，GRPO 省掉价值网络</text>

  <line x1="500" y1="543" x2="500" y2="568" stroke="#4A5568" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ===== Node 6: 策略梯度 ===== -->
  <rect x="150" y="574" width="700" height="72" rx="10" fill="#FFF5F5" stroke="#E53E3E" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="599" font-size="14" font-weight="bold" fill="#C53030">⑥ 策略梯度：好事抬、坏事压</text>
  <text x="180" y="619" font-size="11" fill="#4A5568">∇L = −E[A(τ)·∇ log π_θ(τ)]   （来自期望奖励求导 + log 求导技巧）</text>
  <text x="180" y="637" font-size="11" fill="#4A5568">A&gt;0 抬高这条轨迹概率；A&lt;0 压低 —— 这就是"用奖励改进生成"的本质</text>

  <line x1="500" y1="646" x2="500" y2="671" stroke="#4A5568" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ===== Node 7: PPO + KL ===== -->
  <rect x="150" y="677" width="700" height="72" rx="10" fill="#FED7D7" stroke="#C53030" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="702" font-size="14" font-weight="bold" fill="#9B2C2C">⑦ 用 PPO 稳住更新 + KL 防遗忘</text>
  <text x="180" y="722" font-size="11" fill="#4A5568">ratio=exp(logπ_new−logπ_old) → L=max(−A·ratio, −A·clip(ratio))</text>
  <text x="180" y="740" font-size="11" fill="#4A5568">梯度只反传到 LoRA 参数；KL=(‖μ_θ−μ_ref‖²)/(2σ²) 防止偏离参考模型过远</text>

  <line x1="500" y1="749" x2="500" y2="774" stroke="#3182CE" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arr-blue)"/>

  <!-- ===== Node 8: loop ===== -->
  <rect x="150" y="780" width="700" height="60" rx="10" fill="#EBF8FF" stroke="#3182CE" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="805" font-size="14" font-weight="bold" fill="#2B6CB0">⑧ 回到采样 → 下一个 epoch（on-policy 闭环）</text>
  <text x="180" y="825" font-size="11" fill="#4A5568">采样与训练始终用同一组 θ：先采 log_prob_old，再训 log_prob_new，循环往复直到 reward 上升</text>

  <!-- sidebar: 三个主线 -->
  <rect x="20" y="75" width="110" height="765" rx="8" fill="#F7FAFC" stroke="#CBD5E0" stroke-width="1.5"/>
  <text x="75" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#3182CE">FM 生成</text>
  <text x="75" y="170" text-anchor="middle" font-size="10" fill="#718096">①②</text>
  <text x="75" y="350" text-anchor="middle" font-size="12" font-weight="bold" fill="#6B46C1">对齐打分</text>
  <text x="75" y="370" text-anchor="middle" font-size="10" fill="#718096">③④⑤</text>
  <text x="75" y="590" text-anchor="middle" font-size="12" font-weight="bold" fill="#C53030">策略优化</text>
  <text x="75" y="610" text-anchor="middle" font-size="10" fill="#718096">⑥⑦</text>
  <text x="75" y="790" text-anchor="middle" font-size="12" font-weight="bold" fill="#2B6CB0">闭环</text>
  <text x="75" y="810" text-anchor="middle" font-size="10" fill="#718096">⑧</text>
  <line x1="20" y1="235" x2="130" y2="235" stroke="#CBD5E0" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="20" y1="520" x2="130" y2="520" stroke="#CBD5E0" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="20" y1="745" x2="130" y2="745" stroke="#CBD5E0" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- bottom key insight -->
  <text x="500" y="865" text-anchor="middle" font-size="12" font-weight="bold" fill="#2D3748">一句话总串：FM 教会速度 → 为算概率转 SDE → 高斯给出 log p → 组内 Advantage 定好坏 → 策略梯度抬好压坏 → PPO/KL 稳更新 → 回到采样</text>
</svg>