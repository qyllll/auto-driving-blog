<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 660" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b5bab"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1160" height="660" fill="#ffffff"/>
  <text x="580" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a2b57">Video-Dreamer 基座：Flow Matching 视频生成数据流</text>

  <!-- inputs -->
  <rect x="30" y="60" width="250" height="56" rx="10" fill="#f0f0f5" stroke="#888"/>
  <text x="155" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a2b57">高斯噪声 z_t</text>
  <text x="155" y="105" text-anchor="middle" font-size="12.5" fill="#444">推理从纯噪声出发；训练按 t 插值</text>
  <rect x="30" y="140" width="250" height="60" rx="10" fill="#dbe7ff" stroke="#3b5bab"/>
  <text x="155" y="166" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a2b57">输入视频（训练用）</text>
  <text x="155" y="189" text-anchor="middle" font-size="12.5" fill="#444">480x768, 61 帧 = 原始观测</text>
  <rect x="30" y="560" width="250" height="66" rx="10" fill="#ffe9e0" stroke="#d98324"/>
  <text x="155" y="587" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a4b00">文本指令</text>
  <text x="155" y="610" text-anchor="middle" font-size="12.5" fill="#664">"拿起红杯子放到托盘里"</text>

  <rect x="30" y="230" width="250" height="110" rx="10" fill="#e7f2ff" stroke="#3b5bab"/>
  <text x="155" y="258" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a2b57">3D-VAE 编码器</text>
  <text x="155" y="281" text-anchor="middle" font-size="12.5" fill="#444">时空压缩比 4 x 8 x 8</text>
  <text x="155" y="302" text-anchor="middle" font-size="12.5" fill="#444">（时/高/宽）-&gt; 16 通道 latent</text>
  <text x="155" y="323" text-anchor="middle" font-size="12.5" fill="#444">再做 1x2x2 patchify 切块</text>

  <rect x="30" y="470" width="250" height="60" rx="10" fill="#ffe9e0" stroke="#d98324"/>
  <text x="155" y="496" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a4b00">T5 文本编码器（冻结）</text>
  <text x="155" y="518" text-anchor="middle" font-size="12.5" fill="#664">文本 embedding 作为交叉注意力条件</text>

  <line x1="155" y1="200" x2="155" y2="230" stroke="#3b5bab" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="280" y1="88" x2="345" y2="88" stroke="#888" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="280" y1="285" x2="345" y2="285" stroke="#3b5bab" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="345" y1="88" x2="345" y2="285" stroke="#3b5bab" stroke-width="2"/>
  <text x="30" y="368" font-size="12.5" fill="#555">训练：clean latent 与噪声按 Flow Matching 插值，</text>
  <text x="30" y="390" font-size="12.5" fill="#555">再切 1x2x2 块 + 3D-RoPE 进 DiT</text>
  <path d="M280,500 L310,500 L310,445 L418,445" fill="none" stroke="#d98324" stroke-width="2" marker-end="url(#ar)"/>
  <text x="316" y="466" font-size="12" fill="#b0620a">文本条件</text>

  <!-- DiT -->
  <rect x="420" y="70" width="470" height="380" rx="14" fill="#f4f7ff" stroke="#3b5bab" stroke-width="1.8"/>
  <text x="655" y="98" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a2b57">稀疏注意力 DiT（N x Block）</text>
  <rect x="445" y="118" width="200" height="86" rx="10" fill="#dbe7ff" stroke="#3b5bab"/>
  <text x="545" y="146" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a2b57">稀疏自注意力</text>
  <text x="545" y="170" text-anchor="middle" font-size="12.5" fill="#444">NATTEN 邻域窗口注意力</text>
  <text x="545" y="191" text-anchor="middle" font-size="12.5" fill="#444">相对全图注意力省显存与算力</text>
  <rect x="665" y="118" width="200" height="86" rx="10" fill="#ffe9e0" stroke="#d98324"/>
  <text x="765" y="146" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a4b00">稀疏交叉注意力</text>
  <text x="765" y="170" text-anchor="middle" font-size="12.5" fill="#664">视频 token 查 T5 文本 embedding</text>
  <text x="765" y="191" text-anchor="middle" font-size="12.5" fill="#664">（图文条件注入点）</text>
  <line x1="645" y1="161" x2="665" y2="161" stroke="#3b5bab" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="445" y="225" width="420" height="180" rx="10" fill="#efeaff" stroke="#7a5cd6"/>
  <text x="655" y="252" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#4a3aa0">MoE-FFN：4 路由专家，每 token 激活 Top-2</text>
  <rect x="470" y="270" width="88" height="56" rx="8" fill="#ffffff" stroke="#7a5cd6"/>
  <text x="514" y="304" text-anchor="middle" font-size="13" fill="#4a3aa0">Expert 1</text>
  <rect x="573" y="270" width="88" height="56" rx="8" fill="#ffffff" stroke="#7a5cd6"/>
  <text x="617" y="304" text-anchor="middle" font-size="13" fill="#4a3aa0">Expert 2</text>
  <rect x="676" y="270" width="88" height="56" rx="8" fill="#ffffff" stroke="#7a5cd6"/>
  <text x="720" y="304" text-anchor="middle" font-size="13" fill="#4a3aa0">Expert 3</text>
  <rect x="779" y="270" width="88" height="56" rx="8" fill="#ffffff" stroke="#7a5cd6"/>
  <text x="823" y="304" text-anchor="middle" font-size="13" fill="#4a3aa0">Expert 4</text>
  <text x="655" y="352" text-anchor="middle" font-size="12.5" fill="#444">路由：s = softmax(u^T e_i)，取 Top-k 加权求和</text>
  <text x="655" y="374" text-anchor="middle" font-size="12.5" fill="#444">无共享专家（与 DeepSeek-V2 不同）：按语义区域专精</text>
  <text x="655" y="396" text-anchor="middle" font-size="12.5" fill="#444">负载均衡 L_Load = alpha * sum(f_i * P_i)，alpha = 0.01</text>
  <rect x="445" y="420" width="420" height="18" rx="6" fill="#dbe7ff" stroke="#3b5bab"/>
  <text x="655" y="434" text-anchor="middle" font-size="12.5" fill="#1a2b57">残差 + RMSNorm 贯穿各 Block（略）</text>

  <line x1="340" y1="161" x2="420" y2="161" stroke="#3b5bab" stroke-width="2" marker-end="url(#ar)"/>

  <!-- output -->
  <rect x="930" y="110" width="200" height="76" rx="10" fill="#e7f2ff" stroke="#3b5bab"/>
  <text x="1030" y="138" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a2b57">速度场 v_theta(z_t,t,c)</text>
  <text x="1030" y="161" text-anchor="middle" font-size="12.5" fill="#444">dz_t/dt = v_theta，沿 ODE 积分</text>
  <line x1="890" y1="200" x2="930" y2="160" stroke="#3b5bab" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="930" y="220" width="200" height="64" rx="10" fill="#e7f2ff" stroke="#3b5bab"/>
  <text x="1030" y="246" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a2b57">干净 video latent</text>
  <text x="1030" y="269" text-anchor="middle" font-size="12.5" fill="#444">推理：蒸馏到 1 步 + FP8</text>
  <line x1="1030" y1="186" x2="1030" y2="220" stroke="#3b5bab" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="930" y="320" width="200" height="76" rx="10" fill="#e7f2ff" stroke="#3b5bab"/>
  <text x="1030" y="348" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a2b57">3D-VAE 解码器</text>
  <text x="1030" y="371" text-anchor="middle" font-size="12.5" fill="#444">4x8x8 上采样还原像素</text>
  <line x1="1030" y1="284" x2="1030" y2="320" stroke="#3b5bab" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="930" y="430" width="200" height="70" rx="10" fill="#d9f5e4" stroke="#2f8f5b"/>
  <text x="1030" y="458" text-anchor="middle" font-size="14" font-weight="bold" fill="#17663d">生成的操作视频</text>
  <text x="1030" y="481" text-anchor="middle" font-size="12.5" fill="#336">纹理丰富、时序连贯</text>
  <line x1="1030" y1="396" x2="1030" y2="430" stroke="#2f8f5b" stroke-width="2" marker-end="url(#ar)"/>

  <!-- bottom note -->
  <rect x="330" y="480" width="560" height="146" rx="12" fill="#fff6ec" stroke="#d98324" stroke-width="1.5"/>
  <text x="610" y="508" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#b0620a">训练目标（Flow Matching，式 1）</text>
  <text x="610" y="535" text-anchor="middle" font-size="14" fill="#333" font-family="monospace">d z_t / dt = v_theta(z_t, t, c)，c = {文本, 首帧图像}</text>
  <text x="610" y="565" text-anchor="middle" font-size="12.5" fill="#555">监督信号 = 真实视频的 latent 速度；与扩散的区别只是概率路径取直线</text>
  <text x="610" y="590" text-anchor="middle" font-size="12.5" fill="#555">多视角版本：多相机图像沿宽度拼成一张全景，靠 in-context 学习保持跨视角一致</text>
  <text x="610" y="614" text-anchor="middle" font-size="12.5" fill="#555">激活参数仅 2B（PBench/DreamGen 上打赢 14B 的 Cosmos-Predict2、Wan2.2）</text>
</svg>
