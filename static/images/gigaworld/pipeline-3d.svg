<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 700" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f8f5b"/>
    </marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b5bab"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1160" height="700" fill="#ffffff"/>
  <text x="580" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a2b57">GigaWorld-0-3D 四模块流水线：从图像到"可仿真场景 + 可执行动作"</text>

  <!-- FG -->
  <rect x="30" y="56" width="545" height="210" rx="14" fill="#f3fbf6" stroke="#2f8f5b" stroke-width="1.6"/>
  <text x="300" y="84" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#17663d">3D-FG 前景资产：两道质检 + Trellis 生成</text>
  <rect x="50" y="100" width="150" height="64" rx="8" fill="#ffffff" stroke="#59ac82"/>
  <text x="125" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a2b57">输入源</text>
  <text x="125" y="149" text-anchor="middle" font-size="12.5" fill="#444">真实照片 / 文生图</text>
  <line x1="200" y1="132" x2="222" y2="132" stroke="#2f8f5b" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="226" y="100" width="170" height="64" rx="8" fill="#ffffff" stroke="#59ac82"/>
  <text x="311" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a2b57">Preprocess 质检</text>
  <text x="311" y="145" text-anchor="middle" font-size="12" fill="#444">Aesthetic-Checker 美学分</text>
  <text x="311" y="161" text-anchor="middle" font-size="12" fill="#444">ImageSegChecker(GPT-4o) 分割查</text>
  <line x1="396" y1="132" x2="418" y2="132" stroke="#2f8f5b" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="422" y="100" width="136" height="64" rx="8" fill="#ffffff" stroke="#59ac82"/>
  <text x="490" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a2b57">Trellis</text>
  <text x="490" y="149" text-anchor="middle" font-size="12" fill="#444">图 -&gt; 3D（mesh+GS）</text>
  <rect x="226" y="176" width="332" height="40" rx="8" fill="#ffffff" stroke="#59ac82"/>
  <text x="392" y="201" text-anchor="middle" font-size="12.5" fill="#444">Postprocess：MeshGeoChecker 四正交视角渲染查几何 -&gt; 过关导出 URDF</text>
  <line x1="490" y1="164" x2="490" y2="176" stroke="#2f8f5b" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M226,196 L150,196 L150,167" fill="none" stroke="#d05040" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ar)"/>
  <text x="50" y="240" font-size="12.5" fill="#555">为何要质检：Trellis 高光过曝、无真实尺度、无物理属性，能看不能仿</text>
  <text x="50" y="259" font-size="12.5" fill="#d05040">任一环节不过关（红虚线）：换参数 / 换随机种子回炉重来</text>

  <!-- BG -->
  <rect x="625" y="56" width="505" height="210" rx="14" fill="#f3fbf6" stroke="#2f8f5b" stroke-width="1.6"/>
  <text x="877" y="84" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#17663d">3D-BG 背景重建：稀疏视角 -&gt; 稠密 3DGS</text>
  <rect x="645" y="100" width="140" height="64" rx="8" fill="#ffffff" stroke="#59ac82"/>
  <text x="715" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a2b57">稀疏多视角照片</text>
  <text x="715" y="149" text-anchor="middle" font-size="12" fill="#444">真实场景采集</text>
  <line x1="785" y1="132" x2="807" y2="132" stroke="#2f8f5b" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="811" y="100" width="146" height="64" rx="8" fill="#ffffff" stroke="#59ac82"/>
  <text x="884" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a2b57">3DGRUT 初建</text>
  <text x="884" y="145" text-anchor="middle" font-size="12" fill="#444">每高斯 7 个代表点，</text>
  <text x="884" y="161" text-anchor="middle" font-size="12" fill="#444">支持卷帘快门非针孔</text>
  <line x1="957" y1="132" x2="979" y2="132" stroke="#2f8f5b" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="983" y="100" width="128" height="64" rx="8" fill="#ffffff" stroke="#59ac82"/>
  <text x="1047" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a2b57">视角修复模型</text>
  <text x="1047" y="145" text-anchor="middle" font-size="12" fill="#444">幻觉补中间视角，</text>
  <text x="1047" y="161" text-anchor="middle" font-size="12" fill="#444">消几何/光度伪影</text>
  <rect x="645" y="176" width="466" height="40" rx="8" fill="#ffffff" stroke="#59ac82"/>
  <text x="878" y="201" text-anchor="middle" font-size="12.5" fill="#444">第二阶段：修复后的稠密视角 -&gt; 稠密 3DGS 重建 -&gt; Poisson 表面重建出水密 mesh</text>
  <line x1="1047" y1="164" x2="1047" y2="176" stroke="#2f8f5b" stroke-width="2" marker-end="url(#ar)"/>
  <text x="645" y="248" font-size="12.5" fill="#555">mesh 用途：碰撞检测 / 动力学仿真；GS 用途：照片级渲染</text>

  <!-- merge -->
  <path d="M300,266 L300,300 L588,300" fill="none" stroke="#2f8f5b" stroke-width="2"/>
  <path d="M877,266 L877,300 L592,300" fill="none" stroke="#2f8f5b" stroke-width="2"/>
  <path d="M590,300 L590,326" fill="none" stroke="#2f8f5b" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Phys -->
  <rect x="30" y="330" width="1100" height="160" rx="14" fill="#f3fbf6" stroke="#2f8f5b" stroke-width="1.6"/>
  <text x="580" y="360" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#17663d">3D-Phys 物理赋能：三类物体、三种赋物理方式</text>
  <rect x="50" y="378" width="350" height="98" rx="8" fill="#ffffff" stroke="#59ac82"/>
  <text x="225" y="404" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a2b57">机械臂：可微系统辨识（PINN 三阶段）</text>
  <text x="66" y="428" font-size="12" fill="#444">1. 真实轨迹 x 随机采样 (f,p,d) 跑仿真 rollout</text>
  <text x="66" y="450" font-size="12" fill="#444">2. 训代理模型 M 近似仿真器动力学（可微）</text>
  <text x="66" y="470" font-size="12" fill="#444">3. 冻结 M，梯度下降反推 (f*,p*,d*) 对齐真实</text>
  <rect x="415" y="378" width="350" height="98" rx="8" fill="#ffffff" stroke="#59ac82"/>
  <text x="590" y="404" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a2b57">刚体物体：Qwen3-VL 物理专家</text>
  <text x="431" y="428" font-size="12" fill="#444">正交多视图渲染喂给多模态模型</text>
  <text x="431" y="450" font-size="12" fill="#444">先由前视图 + 文本约束定真实尺度，</text>
  <text x="431" y="470" font-size="12" fill="#444">再预测质量、摩擦系数并挂语义类别</text>
  <rect x="780" y="378" width="330" height="98" rx="8" fill="#ffffff" stroke="#59ac82"/>
  <text x="945" y="404" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a2b57">软体/可形变：弹簧-质点 + 3DGS</text>
  <text x="796" y="428" font-size="12" fill="#444">弹簧-质点系统绑到高斯粒子上</text>
  <text x="796" y="450" font-size="12" fill="#444">（PhysTwin 思路，但其是逐场景优化）</text>
  <text x="796" y="470" font-size="12" fill="#444">本文在探索单目视频前馈直推参数</text>

  <line x1="590" y1="490" x2="590" y2="516" stroke="#2f8f5b" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Act -->
  <rect x="30" y="520" width="1100" height="120" rx="14" fill="#eef3ff" stroke="#3b5bab" stroke-width="1.6"/>
  <text x="580" y="550" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#1a2b57">3D-Act 动作生成：两档难度两条路（论文 Fig.11）</text>
  <rect x="60" y="566" width="510" height="60" rx="8" fill="#ffffff" stroke="#7a97d8"/>
  <text x="315" y="592" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a2b57">简单场景：遥操作/规则少量种子 -&gt; MimicGen 位姿扩展</text>
  <text x="315" y="616" text-anchor="middle" font-size="12" fill="#444">几何一致地复制到新物体位姿与布局，零额外人力</text>
  <rect x="600" y="566" width="510" height="60" rx="8" fill="#ffffff" stroke="#7a97d8"/>
  <text x="855" y="592" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a2b57">复杂场景：遥操作冷启动 -&gt; RLPD 在线强化学习</text>
  <text x="855" y="616" text-anchor="middle" font-size="12" fill="#444">多步推理/接触密集任务：收敛后策略批量刷轨迹</text>

  <text x="580" y="674" text-anchor="middle" font-size="13" fill="#555">合流输出：照片级渲染 + 几何一致 + 物理可执行的场景/轨迹，再经 AppearanceTransfer 文本改外观做零成本域扩增</text>
</svg>
