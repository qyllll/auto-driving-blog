<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" font-family="system-ui, -apple-system, 'Noto Sans SC', sans-serif">
  <defs>
    <filter id="shadow"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.15"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#64748b"/></marker>
  </defs>

  <rect width="800" height="350" fill="#f8fafc" rx="8"/>
  <text x="400" y="25" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">3D → 2D 投影：为什么单张图像丢失了深度信息？</text>

  <!-- Left side: 3D Real World -->
  <text x="180" y="55" text-anchor="middle" font-size="12" font-weight="bold" fill="#4338ca">真实 3D 世界</text>
  <rect x="30" y="65" width="300" height="260" rx="6" fill="white" stroke="#6366f1" stroke-width="1" filter="url(#shadow)"/>

  <!-- Road lines -->
  <line x1="50" y1="310" x2="280" y2="310" stroke="#94a3b8" stroke-width="2"/>
  <line x1="50" y1="310" x2="280" y2="310" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="8,4"/>

  <!-- Camera icon -->
  <rect x="120" y="75" width="50" height="30" rx="3" fill="#e0e7ff" stroke="#6366f1" stroke-width="0.5"/>
  <circle cx="145" cy="90" r="4" fill="#4338ca"/>
  <text x="145" y="98" text-anchor="middle" font-size="6" fill="#4338ca">相机</text>

  <!-- Far big car -->
  <rect x="100" y="200" width="55" height="35" rx="4" fill="#fca5a5" stroke="#ef4444" stroke-width="1.5"/>
  <text x="127" y="220" text-anchor="middle" font-size="7" fill="#991b1b">大车</text>
  <text x="127" y="232" text-anchor="middle" font-size="6" fill="#475569">在远处 (10m)</text>

  <!-- Near small car -->
  <rect x="210" y="250" width="35" height="25" rx="3" fill="#93c5fd" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="227" y="266" text-anchor="middle" font-size="7" fill="#1d4ed8">小车</text>
  <text x="227" y="278" text-anchor="middle" font-size="6" fill="#475569">在近处 (5m)</text>

  <!-- Camera frustum lines -->
  <line x1="145" y1="105" x2="100" y2="200" stroke="#94a3b8" stroke-width="0.5" stroke-dasharray="3,2"/>
  <line x1="145" y1="105" x2="155" y2="200" stroke="#94a3b8" stroke-width="0.5" stroke-dasharray="3,2"/>
  <line x1="145" y1="105" x2="210" y2="250" stroke="#94a3b8" stroke-width="0.5" stroke-dasharray="3,2"/>
  <line x1="145" y1="105" x2="245" y2="250" stroke="#94a3b8" stroke-width="0.5" stroke-dasharray="3,2"/>

  <!-- Arrow -->
  <path d="M340,195 L380,195" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="360" y="188" text-anchor="middle" font-size="8" fill="#64748b">相机投影</text>

  <!-- Right side: 2D Image -->
  <text x="600" y="55" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">2D 相机图像</text>
  <rect x="430" y="65" width="340" height="260" rx="6" fill="white" stroke="#ef4444" stroke-width="1" filter="url(#shadow)"/>

  <!-- Image rectangle -->
  <rect x="450" y="80" width="300" height="200" rx="3" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="600" y="98" text-anchor="middle" font-size="8" fill="#991b1b">图像平面 (像素空间)</text>

  <!-- In the 2D image, both cars look the same size -->
  <!-- Far car in image (same size as small car!) -->
  <rect x="470" y="130" width="40" height="25" rx="3" fill="#fca5a5" stroke="#ef4444" stroke-width="1"/>
  <text x="490" y="148" text-anchor="middle" font-size="7" fill="#991b1b">???</text>
  <text x="490" y="162" text-anchor="middle" font-size="7" fill="#475569">远处大车</text>

  <!-- Near car in image -->
  <rect x="530" y="130" width="40" height="25" rx="3" fill="#93c5fd" stroke="#3b82f6" stroke-width="1"/>
  <text x="550" y="148" text-anchor="middle" font-size="7" fill="#1d4ed8">???</text>
  <text x="550" y="162" text-anchor="middle" font-size="7" fill="#475569">近处小车</text>

  <!-- Both look same size -->
  <rect x="610" y="130" width="40" height="25" rx="3" fill="#d1d5db" stroke="#6b7280" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="630" y="162" text-anchor="middle" font-size="7" fill="#64748b">分不清</text>

  <text x="600" y="195" text-anchor="middle" font-size="8" font-weight="bold" fill="#dc2626">两张在图里一模一样大！</text>

  <!-- Question mark annotation -->
  <path d="M490,155 L630,155" stroke="#dc2626" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="560" y="145" text-anchor="middle" font-size="7" fill="#dc2626">同样大小？</text>

  <!-- Conclusion bar -->
  <rect x="50" y="290" width="700" height="50" rx="6" fill="#1e293b"/>
  <text x="400" y="312" text-anchor="middle" font-size="9" font-weight="bold" fill="#e2e8f0">单张 2D 图像里，大物体在远处 + 小物体在近处 → 投影到图像上完全一样大</text>
  <text x="400" y="330" text-anchor="middle" font-size="8" fill="#94a3b8">VLM 可以识别"有两辆车"，但不知道谁大谁小、谁远谁近</text>
</svg>