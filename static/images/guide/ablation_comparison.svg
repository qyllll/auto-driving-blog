<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="system-ui, -apple-system, 'Noto Sans SC', sans-serif">
  <defs>
    <linearGradient id="g-bar1" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#22c55e"/><stop offset="100%" stop-color="#4ade80"/></linearGradient>
    <linearGradient id="g-bar2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#fbbf24"/></linearGradient>
    <linearGradient id="g-bar3" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#fbbf24"/></linearGradient>
    <linearGradient id="g-bar4" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#ef4444"/><stop offset="100%" stop-color="#f87171"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12"/></filter>
  </defs>

  <rect width="900" height="420" fill="#f8fafc" rx="8"/>
  <text x="450" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">DriveVLA-W0 消融实验: 感知模块的价值</text>
  <text x="450" y="48" text-anchor="middle" font-size="9" fill="#64748b">数据来自 DriveVLA-W0 论文, nuScenes 验证集</text>

  <!-- Collision Rate bars -->
  <text x="60" y="80" font-size="11" font-weight="bold" fill="#991b1b">碰撞率 Collision Rate ↓</text>

  <rect x="60" y="90" width="680" height="22" rx="4" fill="url(#g-bar1)"/>
  <text x="750" y="107" font-size="10" font-weight="bold" fill="#166534">3.2%</text>
  <text x="70" y="106" font-size="9" fill="white" font-weight="bold">完整: ViT tokens + 感知 tokens + 文本</text>

  <rect x="60" y="120" width="220" height="22" rx="4" fill="url(#g-bar2)"/>
  <text x="290" y="137" font-size="10" font-weight="bold" fill="#92400e">8.7%</text>
  <text x="70" y="136" font-size="9" fill="white" font-weight="bold">去掉感知 tokens (只保留 ViT+文本)</text>

  <rect x="60" y="150" width="160" height="22" rx="4" fill="url(#g-bar3)"/>
  <text x="230" y="167" font-size="10" font-weight="bold" fill="#92400e">4.1%</text>
  <text x="70" y="166" font-size="9" fill="white" font-weight="bold">去掉 ViT tokens (只保留感知+文本)</text>

  <rect x="60" y="180" width="80" height="22" rx="4" fill="url(#g-bar4)"/>
  <text x="150" y="197" font-size="10" font-weight="bold" fill="#991b1b">15.3%</text>
  <text x="70" y="196" font-size="9" fill="white" font-weight="bold">纯文本 (无视觉输入)</text>

  <!-- Driving Score bars -->
  <text x="60" y="240" font-size="11" font-weight="bold" fill="#1d4ed8">驾驶得分 Driving Score ↑</text>

  <rect x="60" y="250" width="700" height="22" rx="4" fill="#60a5fa"/>
  <text x="770" y="267" font-size="10" font-weight="bold" fill="#1d4ed8">82.4</text>
  <text x="70" y="266" font-size="9" fill="white" font-weight="bold">完整: ViT tokens + 感知 tokens + 文本</text>

  <rect x="60" y="280" width="580" height="22" rx="4" fill="#93c5fd"/>
  <text x="650" y="297" font-size="10" font-weight="bold" fill="#1d4ed8">71.2</text>
  <text x="70" y="296" font-size="9" fill="white" font-weight="bold">去掉感知 tokens (只保留 ViT+文本)</text>

  <rect x="60" y="310" width="660" height="22" rx="4" fill="#93c5fd"/>
  <text x="730" y="327" font-size="10" font-weight="bold" fill="#1d4ed8">79.8</text>
  <text x="70" y="326" font-size="9" fill="white" font-weight="bold">去掉 ViT tokens (只保留感知+文本)</text>

  <rect x="60" y="340" width="480" height="22" rx="4" fill="#bfdbfe"/>
  <text x="550" y="357" font-size="10" font-weight="bold" fill="#1d4ed8">62.1</text>
  <text x="70" y="356" font-size="9" fill="white" font-weight="bold">纯文本 (无视觉输入)</text>

  <!-- Conclusion -->
  <rect x="60" y="380" width="780" height="28" rx="5" fill="#1e293b"/>
  <text x="450" y="400" text-anchor="middle" font-size="10" font-weight="bold" fill="#e2e8f0">结论: 感知 tokens 对安全性 (碰撞率) 影响最大; ViT tokens 对驾驶质量 (得分) 影响更大; 两者互补</text>
</svg>