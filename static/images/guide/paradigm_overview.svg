  <!-- Bottom section -->
  <rect x="40" y="580" width="1120" height="125" rx="8" fill="#1e293b" filter="url(#shadow)"/>
  <text x="600" y="608" text-anchor="middle" font-size="15" font-weight="bold" fill="#e2e8f0">2026 年融合趋势：从"独立范式"走向"统一系统"</text>
  <text x="60" y="636" font-size="11" fill="#94a3b8">• VLA + 世界模型 = 让 VLA 拥有"想象力"（VLA-World, CVPR 2026: 统一预测想象与反思推理）</text>
  <text x="60" y="658" font-size="11" fill="#94a3b8">• Scoring + JEPA = 用 JEPA 能量函数做自监督评分，不需要 PDM 标签（JEPA-DRIVE 路线）</text>
  <text x="60" y="680" font-size="11" fill="#94a3b8">• E2E + RL = 用 GRPO 优化端到端策略，超越模仿学习上限（Flow-GRPO -> DiffGRPO -> 驾驶应用）</text>
  <text x="60" y="702" font-size="11" fill="#94a3b8">• 终极愿景：VLM理解 + 世界模型推演 + Scoring选优 + RL进化</text>

