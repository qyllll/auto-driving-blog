  <rect x="224" y="142" width="124" height="24" rx="4" fill="#eef2ff" stroke="#c7d2fe" stroke-width="0.5"/>
  <text x="286" y="158" text-anchor="middle" font-size="9" fill="#4338ca">显式E2E (UniAD)</text>
