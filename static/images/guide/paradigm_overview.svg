  <text x="132" y="194" text-anchor="middle" font-size="9" fill="#4338ca">SparseDrive 稀疏化</text>
  <path d="M208,190 L220,190" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="224" y="178" width="124" height="24" rx="4" fill="#eef2ff" stroke="#c7d2fe" stroke-width="0.5"/>
  <text x="286" y="194" text-anchor="middle" font-size="9" fill="#4338ca">DiffusionDrive</text>
  <path d="M286,202 L286,212" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="56" y="214" width="152" height="24" rx="4" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="0.5"/>
  <text x="132" y="230" text-anchor="middle" font-size="8" fill="#64748b">loss设计 + 评测体系</text>
  <path d="M208,226 L220,226" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="224" y="214" width="124" height="24" rx="4" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="0.5"/>
  <text x="286" y="230" text-anchor="middle" font-size="8" fill="#64748b">开环(NAVSIM)+闭环</text>
  <text x="56" y="260" font-size="9" fill="#64748b">挑战：可解释性、数据需求、安全验证</text>
  <text x="56" y="278" font-size="9" fill="#64748b">代表：UniAD(Best Paper), VAD, SparseDrive</text>

