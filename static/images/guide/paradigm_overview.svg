  <rect x="436" y="216" width="152" height="24" rx="4" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="0.5"/>
  <text x="512" y="232" text-anchor="middle" font-size="8" fill="#64748b">DriveVLM / GR-3 对比</text>
  <path d="M588,228 L600,228" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="604" y="216" width="152" height="24" rx="4" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="0.5"/>
