  <text x="220" y="93" text-anchor="middle" font-size="15" font-weight="bold" fill="white">端到端自动驾驶 E2E</text>
  <text x="56" y="122" font-size="11" fill="#475569">核心理念：传感器 → 一个网络 → 控制，消除信息损失</text>
