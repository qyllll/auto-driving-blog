  <text x="596" y="499" text-anchor="middle" font-size="9" fill="#64748b">应用：特征提取(DRIVE-JEPA) / 自监督评分(JEPA-DRIVE)</text>
  <text x="436" y="525" font-size="9" fill="#64748b">优势：省算力、语义表征；挑战：表征坍缩、长程预测</text>

  <!-- Box 6: RL + Generation -->
