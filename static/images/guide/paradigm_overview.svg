  <text x="592" y="423" text-anchor="middle" font-size="9" fill="#1d4ed8">Predictor</text>
  <path d="M632,419 L644,419" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="648" y="407" width="100" height="24" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.5"/>
