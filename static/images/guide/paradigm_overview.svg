  <text x="216" y="497" text-anchor="middle" font-size="9" fill="#64748b">ScoreNet: MLP vs CrossAttn vs Pairwise</text>
  <text x="56" y="525" font-size="9" fill="#64748b">代表：VADv2, Hydra-MDP, SparseDriveV2</text>

  <!-- Box 5: JEPA -->
  <rect x="420" y="335" width="360" height="210" rx="8" fill="white" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
