<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350">
  <style>
    text { font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .title { font-size: 15px; font-weight: bold; fill: #1a1a2e; }
    .label { font-size: 12px; fill: #555; }
    .eq { font-size: 13px; font-family: 'Times New Roman', serif; fill: #333; }
  </style>

  <text x="400" y="25" text-anchor="middle" class="title">回归损失对比：L1 vs L2 (MSE) vs Smooth L1</text>

  <!-- L1 -->
  <rect x="20" y="45" width="240" height="280" rx="8" fill="#F8F9FA" stroke="#4A90D9" stroke-width="1.5"/>
  <text x="140" y="70" text-anchor="middle" class="title" fill="#4A90D9">L1 Loss (MAE)</text>
  <text x="140" y="95" text-anchor="middle" class="eq">ℒ = |y − ŷ|</text>

  <line x1="50" y1="200" x2="230" y2="200" stroke="#ccc" stroke-width="1"/>
  <line x1="140" y1="110" x2="140" y2="190" stroke="#ccc" stroke-width="1"/>

  <!-- L1 V-shape -->
  <polyline points="60,170 80,150 100,130 120,110 140,110 160,130 180,150 200,170 220,190"
            fill="none" stroke="#4A90D9" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- L2 -->
  <polyline points="60,195 80,170 100,145 120,122 140,110 160,122 180,145 200,170 220,195"
            fill="none" stroke="#E74C3C" stroke-width="2" stroke-linejoin="round" stroke-dasharray="5,3"/>

  <circle cx="140" cy="110" r="3" fill="#333"/>
  <text x="145" y="108" font-size="10" fill="#333">0</text>
  <text x="40" y="195" font-size="10" fill="#999">Loss</text>
  <text x="230" y="215" font-size="10" fill="#999">误差 |y−ŷ|</text>

  <text x="140" y="250" text-anchor="middle" class="label">优点：对异常值鲁棒</text>
  <text x="140" y="268" text-anchor="middle" class="label" fill="#E74C3C">缺点：大误差处梯度恒定</text>
  <text x="140" y="295" text-anchor="middle" class="label" fill="#888">用于：框回归(UniAD)、轨迹回归</text>

  <!-- L2 -->
  <rect x="280" y="45" width="240" height="280" rx="8" fill="#F8F9FA" stroke="#E74C3C" stroke-width="1.5"/>
  <text x="400" y="70" text-anchor="middle" class="title" fill="#E74C3C">L2 Loss (MSE)</text>
  <text x="400" y="95" text-anchor="middle" class="eq">ℒ = (y − ŷ)²</text>

  <line x1="310" y1="200" x2="490" y2="200" stroke="#ccc" stroke-width="1"/>
  <line x1="400" y1="110" x2="400" y2="190" stroke="#ccc" stroke-width="1"/>

  <!-- Quadratic curve -->
  <path d="M320 195 Q340 150 370 120 Q390 105 400 100 Q410 105 430 120 Q460 150 480 195"
        fill="none" stroke="#E74C3C" stroke-width="2.5"/>
  <!-- L1 for comparison -->
  <polyline points="320,170 340,150 360,130 380,115 400,110 420,115 440,130 460,150 480,170"
            fill="none" stroke="#4A90D9" stroke-width="1.5" stroke-dasharray="4,3"/>

  <circle cx="400" cy="100" r="3" fill="#333"/>
  <text x="405" y="98" font-size="10" fill="#333">0</text>
  <text x="300" y="195" font-size="10" fill="#999">Loss</text>
  <text x="490" y="215" font-size="10" fill="#999">误差 |y−ŷ|</text>

  <text x="400" y="250" text-anchor="middle" class="label" fill="#E74C3C">优点：大误差梯度大（收敛快）</text>
  <text x="400" y="268" text-anchor="middle" class="label">缺点：异常值主导梯度</text>
  <text x="400" y="295" text-anchor="middle" class="label" fill="#888">用于：规划轨迹(UniAD)、BEV回归</text>

  <!-- Smooth L1 -->
  <rect x="540" y="45" width="240" height="280" rx="8" fill="#F8F9FA" stroke="#27AE60" stroke-width="1.5"/>
  <text x="660" y="70" text-anchor="middle" class="title" fill="#27AE60">Smooth L1</text>
  <text x="660" y="95" text-anchor="middle" class="eq">ℒ = 0.5x² (|x|&lt;1)</text>
  <text x="660" y="113" text-anchor="middle" class="eq">ℒ = |x|−0.5 (|x|≥1)</text>

  <line x1="570" y1="200" x2="750" y2="200" stroke="#ccc" stroke-width="1"/>
  <line x1="660" y1="110" x2="660" y2="190" stroke="#ccc" stroke-width="1"/>

  <!-- Smooth L1 curve -->
  <path d="M590 185 Q610 155 640 120 Q655 106 660 103 Q665 106 680 120 Q710 155 730 185"
        fill="none" stroke="#27AE60" stroke-width="2.5"/>

  <circle cx="660" cy="103" r="3" fill="#333"/>
  <text x="665" y="101" font-size="10" fill="#333">0</text>
  <text x="560" y="195" font-size="10" fill="#999">Loss</text>
  <text x="750" y="215" font-size="10" fill="#999">误差 |y−ŷ|</text>

  <text x="660" y="250" text-anchor="middle" class="label" fill="#27AE60">✅ 小误差处梯度平滑(类L2)</text>
  <text x="660" y="268" text-anchor="middle" class="label" fill="#27AE60">✅ 大误差处梯度恒定(类L1)</text>
  <text x="660" y="295" text-anchor="middle" class="label" fill="#888">用于：检测框回归(Faster R-CNN)</text>
</svg>