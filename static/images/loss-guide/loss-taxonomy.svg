<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620">
  <style>
    text { font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 13px; fill: #333; }
    .title { font-size: 18px; font-weight: bold; fill: #1a1a2e; }
    .cat { font-size: 12px; font-weight: bold; fill: #fff; }
    .leaf { font-size: 11px; fill: #555; }
    .note { font-size: 11px; fill: #888; }
  </style>

  <text x="450" y="30" text-anchor="middle" class="title">端到端自动驾驶中的损失函数全景</text>

  <!-- Regression -->
  <rect x="30" y="55" width="260" height="32" rx="6" fill="#4A90D9"/>
  <text x="160" y="76" text-anchor="middle" class="cat">① 回归损失（Regression Loss）</text>

  <rect x="40" y="97" width="75" height="26" rx="4" fill="#E8F0FE"/>
  <text x="77" y="114" text-anchor="middle" class="leaf">L1 / MAE</text>
  <rect x="122" y="97" width="75" height="26" rx="4" fill="#E8F0FE"/>
  <text x="159" y="114" text-anchor="middle" class="leaf">L2 / MSE</text>
  <rect x="204" y="97" width="75" height="26" rx="4" fill="#E8F0FE"/>
  <text x="241" y="114" text-anchor="middle" class="leaf">Smooth L1</text>

  <text x="160" y="145" text-anchor="middle" class="note">框回归 · 轨迹回归 · 点集回归</text>

  <!-- Classification -->
  <rect x="320" y="55" width="260" height="32" rx="6" fill="#E67E22"/>
  <text x="450" y="76" text-anchor="middle" class="cat">② 分类损失（Classification Loss）</text>

  <rect x="330" y="97" width="72" height="26" rx="4" fill="#FFF3E0"/>
  <text x="366" y="114" text-anchor="middle" class="leaf">交叉熵</text>
  <rect x="409" y="97" width="72" height="26" rx="4" fill="#FFF3E0"/>
  <text x="445" y="114" text-anchor="middle" class="leaf">Focal Loss</text>
  <rect x="488" y="97" width="82" height="26" rx="4" fill="#FFF3E0"/>
  <text x="529" y="114" text-anchor="middle" class="leaf">BCE / sigmoid</text>

  <text x="450" y="145" text-anchor="middle" class="note">目标检测 · 意图分类 · 可通行判断</text>

  <!-- Distribution -->
  <rect x="610" y="55" width="260" height="32" rx="6" fill="#27AE60"/>
  <text x="740" y="76" text-anchor="middle" class="cat">③ 分布损失（Distribution Loss）</text>

  <rect x="620" y="97" width="75" height="26" rx="4" fill="#E8F8E8"/>
  <text x="657" y="114" text-anchor="middle" class="leaf">KL 散度</text>
  <rect x="702" y="97" width="75" height="26" rx="4" fill="#E8F8E8"/>
  <text x="739" y="114" text-anchor="middle" class="leaf">JS 散度</text>
  <rect x="784" y="97" width="76" height="26" rx="4" fill="#E8F8E8"/>
  <text x="822" y="114" text-anchor="middle" class="leaf">Wasserstein</text>

  <text x="740" y="145" text-anchor="middle" class="note">概率规划 · 知识蒸馏 · 表征对齐</text>

  <!-- Safety -->
  <rect x="30" y="175" width="380" height="32" rx="6" fill="#C0392B"/>
  <text x="220" y="196" text-anchor="middle" class="cat">④ 安全约束损失（Safety / Constraint Loss）</text>

  <rect x="40" y="217" width="110" height="26" rx="4" fill="#FDEDEC"/>
  <text x="95" y="234" text-anchor="middle" class="leaf">碰撞损失</text>
  <rect x="158" y="217" width="110" height="26" rx="4" fill="#FDEDEC"/>
  <text x="213" y="234" text-anchor="middle" class="leaf">边界约束</text>
  <rect x="276" y="217" width="125" height="26" rx="4" fill="#FDEDEC"/>
  <text x="338" y="234" text-anchor="middle" class="leaf">舒适度损失 (jerk)</text>

  <text x="220" y="265" text-anchor="middle" class="note">规划安全 · 碰撞避免 · 可行驶区域合规</text>

  <!-- Generation -->
  <rect x="440" y="175" width="430" height="32" rx="6" fill="#8E44AD"/>
  <text x="655" y="196" text-anchor="middle" class="cat">⑤ 生成 / 扩散损失（Generation / Diffusion Loss）</text>

  <rect x="450" y="217" width="125" height="26" rx="4" fill="#F4ECF7"/>
  <text x="512" y="234" text-anchor="middle" class="leaf">简单损失 (ε预测)</text>
  <rect x="583" y="217" width="125" height="26" rx="4" fill="#F4ECF7"/>
  <text x="645" y="234" text-anchor="middle" class="leaf">得分匹配 (Score)</text>
  <rect x="716" y="217" width="145" height="26" rx="4" fill="#F4ECF7"/>
  <text x="788" y="234" text-anchor="middle" class="leaf">Flow Matching (CFM)</text>

  <text x="655" y="265" text-anchor="middle" class="note">扩散规划 · 轨迹生成 · 场景生成</text>

  <!-- Ranking -->
  <rect x="30" y="295" width="240" height="32" rx="6" fill="#2980B9"/>
  <text x="150" y="316" text-anchor="middle" class="cat">⑥ 排序 / 对比损失</text>

  <rect x="40" y="337" width="105" height="26" rx="4" fill="#EAF2F8"/>
  <text x="92" y="354" text-anchor="middle" class="leaf">Margin-Rank</text>
  <rect x="153" y="337" width="108" height="26" rx="4" fill="#EAF2F8"/>
  <text x="207" y="354" text-anchor="middle" class="leaf">Triplet Loss</text>

  <text x="150" y="385" text-anchor="middle" class="note">轨迹排序 · 模式选择</text>

  <!-- RL -->
  <rect x="300" y="295" width="280" height="32" rx="6" fill="#D35400"/>
  <text x="440" y="316" text-anchor="middle" class="cat">⑦ 强化学习损失（RL Loss）</text>

  <rect x="310" y="337" width="80" height="26" rx="4" fill="#FDEBD0"/>
  <text x="350" y="354" text-anchor="middle" class="leaf">PPO-Clip</text>
  <rect x="398" y="337" width="80" height="26" rx="4" fill="#FDEBD0"/>
  <text x="438" y="354" text-anchor="middle" class="leaf">GRPO</text>
  <rect x="486" y="337" width="85" height="26" rx="4" fill="#FDEBD0"/>
  <text x="528" y="354" text-anchor="middle" class="leaf">REINFORCE</text>

  <text x="440" y="385" text-anchor="middle" class="note">策略优化 · 奖励对齐</text>

  <!-- Multi-task -->
  <rect x="610" y="295" width="260" height="32" rx="6" fill="#16A085"/>
  <text x="740" y="316" text-anchor="middle" class="cat">⑧ 多任务平衡策略</text>

  <rect x="620" y="337" width="115" height="26" rx="4" fill="#E8F6F3"/>
  <text x="677" y="354" text-anchor="middle" class="leaf">不确定性加权</text>
  <rect x="743" y="337" width="118" height="26" rx="4" fill="#E8F6F3"/>
  <text x="802" y="354" text-anchor="middle" class="leaf">梯度裁剪 / 归一化</text>

  <text x="740" y="385" text-anchor="middle" class="note">联合训练 · 梯度平衡</text>

  <!-- Bottom summary -->
  <line x1="160" y1="410" x2="160" y2="440" stroke="#bbb" stroke-width="1" stroke-dasharray="4"/>
  <line x1="450" y1="410" x2="450" y2="440" stroke="#bbb" stroke-width="1" stroke-dasharray="4"/>
  <line x1="740" y1="410" x2="740" y2="440" stroke="#bbb" stroke-width="1" stroke-dasharray="4"/>

  <text x="160" y="458" text-anchor="middle" class="note">回归误差 → 最小值</text>
  <text x="450" y="458" text-anchor="middle" class="note">分布匹配 → 多样性</text>
  <text x="740" y="458" text-anchor="middle" class="note">任务协作 → 全局最优</text>

  <text x="450" y="490" text-anchor="middle" class="note">传统回归范式 _________________ 概率生成范式 __________________ 多任务联合范式</text>

  <line x1="100" y1="505" x2="800" y2="505" stroke="#ddd" stroke-width="1"/>
  <text x="450" y="530" text-anchor="middle" fill="#999" font-size="11">端到端自动的驾驶核心命题：从「预测误差最小化」到「驾驶质量最优化」</text>
</svg>