<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" font-family="'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="dc" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <style>
      .src{fill:#1e293b;}
      .proc{fill:#e0f2fe;stroke:#0284c7;stroke-width:1.5;}
      .filter{fill:#fef3c7;stroke:#d97706;stroke-width:1.5;}
      .split{fill:#dbeafe;stroke:#2563eb;stroke-width:1.5;}
      .test{fill:#fee2e2;stroke:#dc2626;stroke-width:1.5;}
      .wt{font-size:13px;fill:#ffffff;text-anchor:middle;}
      .t{font-size:13px;fill:#0f172a;text-anchor:middle;}
      .st{font-size:11px;fill:#475569;text-anchor:middle;}
      .cap{font-size:11px;fill:#334155;}
    </style>
  </defs>

  <text x="460" y="26" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="middle">NAVSIM 数据加工链：OpenScene → scene 采样 → 过滤 → 数据集</text>

  <rect x="300" y="46" width="320" height="54" rx="8" class="src"/>
  <text x="460" y="68" class="wt">OpenScene（即 nuPlan 日志降采样到 2Hz）</text>
  <text x="460" y="88" class="wt" font-size="11">trainval &gt;2000GB / test 217GB / mini 151GB</text>

  <text x="460" y="132" class="cap" text-anchor="middle">按 scene_filter 参数切帧，生成 scene</text>
  <line x1="460" y1="86" x2="460" y2="118" stroke="#475569" stroke-width="2" marker-end="url(#dc)"/>

  <rect x="290" y="142" width="340" height="56" rx="8" class="proc"/>
  <text x="460" y="164" class="t">split_list 滑窗采样 → scene 截取</text>
  <text x="460" y="184" class="st">以某帧为中心：4 帧历史（2s）+ 10 帧未来（5s），步长 frame_interval</text>

  <rect x="90" y="220" width="240" height="64" rx="8" class="filter"/>
  <text x="210" y="244" class="t">SceneFilter 过滤</text>
  <text x="210" y="264" class="st">has_route=true · 只留有路由帧</text>
  <text x="210" y="276" class="st">log_names 显式圈定（1192 段）</text>

  <rect x="360" y="220" width="240" height="64" rx="8" class="filter"/>
  <text x="480" y="244" class="t">裁剪验证集</text>
  <text x="480" y="264" class="st">从 navtrain 中拔出</text>
  <text x="480" y="276" class="st">13180 训练 + 2730 验证 logs</text>

  <rect x="630" y="220" width="240" height="64" rx="8" class="filter"/>
  <text x="750" y="244" class="t">难例挑选</text>
  <text x="750" y="264" class="st">保留转弯/变道/交互</text>
  <text x="750" y="276" class="st">剔掉无聊直行</text>

  <line x1="210" y1="284" x2="300" y2="320" stroke="#475569" stroke-width="2" marker-end="url(#dc)"/>
  <line x1="480" y1="284" x2="520" y2="320" stroke="#475569" stroke-width="2" marker-end="url(#dc)"/>
  <line x1="750" y1="284" x2="670" y2="320" stroke="#475569" stroke-width="2" marker-end="url(#dc)"/>

  <rect x="120" y="330" width="240" height="62" rx="8" class="split"/>
  <text x="240" y="354" class="t">navtrain（103,288 帧）</text>
  <text x="240" y="372" class="st" fill="#1d4ed8">✅ 唯一准许训练 · 传感器 445GB</text>
  <line x1="240" y1="392" x2="240" y2="420" stroke="#2563eb" stroke-width="2" marker-end="url(#dc)"/>
  <rect x="120" y="424" width="240" height="46" rx="8" class="filter"/>
  <text x="240" y="445" class="t">train_logs 13,180</text>
  <text x="240" y="461" class="st">按 log 整段切分</text>

  <rect x="400" y="330" width="240" height="62" rx="8" class="split"/>
  <text x="540" y="354" class="t">navtest（12,146 帧）</text>
  <text x="540" y="372" class="st">test 池 · 传感器 223GB</text>
  <text x="540" y="384" class="st" fill="#b91c1c">🚫 禁止用于训练</text>
  <line x1="540" y1="392" x2="540" y2="420" stroke="#dc2626" stroke-width="2" marker-end="url(#dc)"/>
  <rect x="430" y="424" width="240" height="46" rx="8" class="filter"/>
  <text x="540" y="445" class="t">navhard_two_stage</text>
  <text x="540" y="461" class="st">真实帧 + 合成帧 / 伪闭环</text>

  <rect x="660" y="330" width="240" height="62" rx="8" class="test"/>
  <text x="780" y="354" class="t">warmup / private_test</text>
  <text x="780" y="372" class="st">挑战赛用 · 1.2GB / 11GB</text>
  <text x="780" y="384" class="st" fill="#b91c1c">🚫 禁止训练</text>

  <text x="460" y="512" class="cap" text-anchor="middle">scene：以「带路由的某帧」为中心的时序窗口；重叠帧允许（同帧可出现在多个 scene）</text>
  <text x="460" y="530" class="cap" text-anchor="middle">帧以 2Hz 采集 NAVSIM_INTERVAL_LENGTH=0.5s · 历史观测 2s / 未来 5s</text>
  <text x="460" y="548" class="cap" text-anchor="middle">train/val 按 log 分切（不按帧），防止同段行车记录跨集泄漏</text>
</svg>