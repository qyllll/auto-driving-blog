<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, sans-serif">
  <!-- Background -->
  <rect width="800" height="500" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#2c3e50">感知-动作循环（Perception-Action Loop）</text>
  
  <!-- Central loop circle -->
  <circle cx="400" cy="260" r="120" fill="none" stroke="#3498db" stroke-width="4" stroke-dasharray="10,5"/>
  
  <!-- Perception node (top) -->
  <circle cx="400" cy="140" r="50" fill="#9b59b6" opacity="0.9"/>
  <text x="400" y="135" text-anchor="middle" font-size="14" font-weight="bold" fill="white">感知</text>
  <text x="400" y="155" text-anchor="middle" font-size="10" fill="white">Perception</text>
  
  <!-- Decision node (right) -->
  <circle cx="520" cy="260" r="50" fill="#3498db" opacity="0.9"/>
  <text x="520" y="255" text-anchor="middle" font-size="14" font-weight="bold" fill="white">决策</text>
  <text x="520" y="275" text-anchor="middle" font-size="10" fill="white">Decision</text>
  
  <!-- Action node (bottom) -->
  <circle cx="400" cy="380" r="50" fill="#2ecc71" opacity="0.9"/>
  <text x="400" y="375" text-anchor="middle" font-size="14" font-weight="bold" fill="white">动作</text>
  <text x="400" y="395" text-anchor="middle" font-size="10" fill="white">Action</text>
  
  <!-- Environment node (left) -->
  <circle cx="280" cy="260" r="50" fill="#e74c3c" opacity="0.9"/>
  <text x="280" y="255" text-anchor="middle" font-size="14" font-weight="bold" fill="white">环境</text>
  <text x="280" y="275" text-anchor="middle" font-size="10" fill="white">Environment</text>
  
  <!-- Arrows -->
  <!-- Perception to Decision -->
  <path d="M 445 165 Q 490 200 500 220" stroke="#555" stroke-width="3" fill="none" marker-end="url(#arrow2)"/>
  <text x="480" y="185" font-size="10" fill="#555">信息提取</text>
  
  <!-- Decision to Action -->
  <path d="M 520 310 Q 500 340 445 365" stroke="#555" stroke-width="3" fill="none" marker-end="url(#arrow2)"/>
  <text x="500" y="340" font-size="10" fill="#555">策略输出</text>
  
  <!-- Action to Environment -->
  <path d="M 355 365 Q 310 340 295 310" stroke="#555" stroke-width="3" fill="none" marker-end="url(#arrow2)"/>
  <text x="300" y="345" font-size="10" fill="#555">物理交互</text>
  
  <!-- Environment to Perception -->
  <path d="M 280 210 Q 300 180 355 155" stroke="#555" stroke-width="3" fill="none" marker-end="url(#arrow2)"/>
  <text x="290" y="180" font-size="10" fill="#555">状态反馈</text>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
  </defs>
  
  <!-- Description boxes -->
  <rect x="50" y="430" width="180" height="55" rx="5" fill="#ecf0f1" stroke="#bdc3c7"/>
  <text x="60" y="450" font-size="11" font-weight="bold" fill="#2c3e50">感知（Perception）</text>
  <text x="60" y="468" font-size="9" fill="#555">视觉、触觉、听觉等</text>
  <text x="60" y="480" font-size="9" fill="#555">多模态信息融合</text>
  
  <rect x="250" y="430" width="180" height="55" rx="5" fill="#ecf0f1" stroke="#bdc3c7"/>
  <text x="260" y="450" font-size="11" font-weight="bold" fill="#2c3e50">决策（Decision）</text>
  <text x="260" y="468" font-size="9" fill="#555">策略网络推理</text>
  <text x="260" y="480" font-size="9" fill="#555">动作规划与生成</text>
  
  <rect x="450" y="430" width="180" height="55" rx="5" fill="#ecf0f1" stroke="#bdc3c7"/>
  <text x="460" y="450" font-size="11" font-weight="bold" fill="#2c3e50">动作（Action）</text>
  <text x="460" y="468" font-size="9" fill="#555">电机控制指令</text>
  <text x="460" y="480" font-size="9" fill="#555">末端执行器运动</text>
  
  <rect x="630" y="430" width="150" height="55" rx="5" fill="#ecf0f1" stroke="#bdc3c7"/>
  <text x="640" y="450" font-size="11" font-weight="bold" fill="#2c3e50">环境（Environment）</text>
  <text x="640" y="468" font-size="9" fill="#555">物理世界交互</text>
  <text x="640" y="480" font-size="9" fill="#555">状态转移反馈</text>
  
  <!-- Key insight -->
  <rect x="580" y="80" width="200" height="60" rx="8" fill="#fff3cd" stroke="#ffc107"/>
  <text x="590" y="100" font-size="11" font-weight="bold" fill="#856404">核心洞察</text>
  <text x="590" y="118" font-size="9" fill="#856404">感知和动作是紧密耦合的，</text>
  <text x="590" y="132" font-size="9" fill="#856404">而非独立的模块</text>
</svg>