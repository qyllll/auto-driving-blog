<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="system-ui, -apple-system, 'Noto Sans SC', sans-serif">
  <defs>
    <linearGradient id="g-flow" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#818cf8"/></linearGradient>
    <linearGradient id="g-diff" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#fbbf24"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.12"/></filter>
  </defs>

  <rect width="1000" height="620" fill="#f8fafc" rx="8"/>
  <text x="500" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Flow-GRPO vs DiffGRPO：两种范式的技术对比</text>
  <text x="500" y="48" text-anchor="middle" font-size="9" fill="#64748b">Flow Matching + GRPO vs Diffusion + GRPO — 哪个更适合你的轨迹优化任务？</text>

  <!-- Flow-GRPO side -->
  <rect x="30" y="60" width="460" height="540" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="30" y="60" width="460" height="35" rx="8" fill="url(#g-flow)"/>
  <rect x="30" y="80" width="460" height="15" fill="url(#g-flow)"/>
  <text x="260" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Flow-GRPO (NeurIPS 2025)</text>

  <rect x="45" y="105" width="430" height="28" rx="4" fill="#e0e7ff"/>
  <text x="260" y="124" text-anchor="middle" font-size="10" font-weight="bold" fill="#4338ca">基础模型：Flow Matching (连续归一化流)</text>

  <rect x="45" y="143" width="430" height="80" rx="5" fill="white" stroke="#6366f1" stroke-width="0.5"/>
  <text x="260" y="163" text-anchor="middle" font-size="10" font-weight="bold" fill="#4338ca">生成过程</text>
  <text x="55" y="183" font-size="9" fill="#475569">dx = v_θ(x, t) dt + σ(t) dw</text>
  <text x="55" y="201" font-size="9" fill="#475569">线性插值路径: x_t = (1-t)x₀ + tx₁</text>
  <text x="55" y="217" font-size="8" fill="#94a3b8">t=0 → t=1 的连续变换，可逆</text>

  <rect x="45" y="233" width="430" height="80" rx="5" fill="white" stroke="#6366f1" stroke-width="0.5"/>
  <text x="260" y="253" text-anchor="middle" font-size="10" font-weight="bold" fill="#4338ca">log-prob 计算</text>
  <text x="55" y="273" font-size="9" fill="#475569">Girsanov 定理（Itô 积分路径测度）</text>
  <text x="55" y="291" font-size="9" fill="#475569">连续时间 → 精确连续路径概率</text>
  <text x="55" y="307" font-size="8" fill="#94a3b8">数学上更优雅, 但实现复杂</text>

  <rect x="45" y="323" width="430" height="80" rx="5" fill="white" stroke="#6366f1" stroke-width="0.5"/>
  <text x="260" y="343" text-anchor="middle" font-size="10" font-weight="bold" fill="#4338ca">Denoising Reduction</text>
  <text x="55" y="363" font-size="9" fill="#475569">随机采样 K 个时间步（K=1~4）</text>
  <text x="55" y="381" font-size="9" fill="#475569">在采样点上计算条件 log-prob</text>
  <text x="55" y="397" font-size="8" fill="#94a3b8">训练速度提升 10-20 倍</text>

  <rect x="45" y="413" width="430" height="70" rx="5" fill="white" stroke="#6366f1" stroke-width="0.5"/>
  <text x="260" y="433" text-anchor="middle" font-size="10" font-weight="bold" fill="#4338ca">优势</text>
  <text x="55" y="453" font-size="9" fill="#475569">• 连续可逆 → 精确概率路径</text>
  <text x="55" y="471" font-size="9" fill="#475569">• DR 技术使训练可行</text>
  <text x="55" y="489" font-size="9" fill="#475569">• GRPO 无 Critic → 显存友好</text>

  <rect x="45" y="493" width="430" height="95" rx="5" fill="#fef2f2" stroke="#fca5a5" stroke-width="0.5"/>
  <text x="260" y="513" text-anchor="middle" font-size="10" font-weight="bold" fill="#991b1b">局限</text>
  <text x="55" y="533" font-size="9" fill="#475569">• SDE 转换引入额外噪声 → 生成质量略微下降</text>
  <text x="55" y="551" font-size="9" fill="#475569">• Girsanov 定理实现复杂 → 调试门槛高</text>
  <text x="55" y="569" font-size="9" fill="#475569">• σ(t) 的幅度需要精细调参</text>

  <!-- DiffGRPO side -->
  <rect x="510" y="60" width="460" height="540" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="510" y="60" width="460" height="35" rx="8" fill="url(#g-diff)"/>
  <rect x="510" y="80" width="460" height="15" fill="url(#g-diff)"/>
  <text x="740" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="white">DiffGRPO (2026)</text>

  <rect x="525" y="105" width="430" height="28" rx="4" fill="#fefce8"/>
  <text x="740" y="124" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400e">基础模型：扩散模型 (DDPM/DDIM)</text>

  <rect x="525" y="143" width="430" height="80" rx="5" fill="white" stroke="#f59e0b" stroke-width="0.5"/>
  <text x="740" y="163" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400e">生成过程</text>
  <text x="535" y="183" font-size="9" fill="#475569">x_{t-1} = μ_θ(x_t, t) + σ_t ε</text>
  <text x="535" y="201" font-size="9" fill="#475569">离散时间马尔可夫链: x_T → x_0</text>
  <text x="535" y="217" font-size="8" fill="#94a3b8">t=T → t=0 的逐步去噪，离散</text>

  <rect x="525" y="233" width="430" height="80" rx="5" fill="white" stroke="#f59e0b" stroke-width="0.5"/>
  <text x="740" y="253" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400e">log-prob 计算</text>
  <text x="535" y="273" font-size="9" fill="#475569">ELBO 下界近似（变分推断）</text>
  <text x="535" y="291" font-size="9" fill="#475569">离散时间 → 每步高斯近似</text>
  <text x="535" y="307" font-size="8" fill="#94a3b8">近似程度更高, 但实现更简单</text>

  <rect x="525" y="323" width="430" height="80" rx="5" fill="white" stroke="#f59e0b" stroke-width="0.5"/>
  <text x="740" y="343" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400e">训练策略</text>
  <text x="535" y="363" font-size="9" fill="#475569">直接用扩散损失 L_simple 替代 log-prob</text>
  <text x="535" y="381" font-size="9" fill="#475569">奖励加权 MSE: L = E[ R(τ) ||ε - ε_θ||² ]</text>
  <text x="535" y="397" font-size="8" fill="#94a3b8">不需要 SDE 转换, 实现极简</text>

  <rect x="525" y="413" width="430" height="70" rx="5" fill="white" stroke="#f59e0b" stroke-width="0.5"/>
  <text x="740" y="433" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400e">优势</text>
  <text x="535" y="453" font-size="9" fill="#475569">• 实现极其简单（几行代码改动）</text>
  <text x="535" y="471" font-size="9" fill="#475569">• 不需要 SDE 转换 → 生成质量无损</text>
  <text x="535" y="489" font-size="9" fill="#475569">• 训练稳定, 不易训飞</text>

  <rect x="525" y="493" width="430" height="95" rx="5" fill="#fef2f2" stroke="#fca5a5" stroke-width="0.5"/>
  <text x="740" y="513" text-anchor="middle" font-size="10" font-weight="bold" fill="#991b1b">局限</text>
  <text x="535" y="533" font-size="9" fill="#475569">• ELBO 近似不如 Girsanov 定理精确</text>
  <text x="535" y="551" font-size="9" fill="#475569">• 扩散模型反向过程是离散的 → 理论上限可能更低</text>
  <text x="535" y="569" font-size="9" fill="#475569">• 加权 MSE 的 reward 权重需要调参</text>
</svg>