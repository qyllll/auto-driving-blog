<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4A5568"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#3182CE"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#38A169"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#E53E3E"/>
    </marker>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
  </defs>

  <text x="550" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2D3748">SimWAM 架构总览：训练时 vs 推理时</text>

  <!-- ========== TRAINING PHASE ========== -->
  <text x="270" y="65" text-anchor="middle" font-size="15" font-weight="bold" fill="#2B6CB0">训练时（SFT / FlowGRPO）</text>

  <!-- Input images -->
  <rect x="30" y="90" width="100" height="60" rx="8" fill="#EBF8FF" stroke="#3182CE" stroke-width="1.5" filter="url(#sh)"/>
  <text x="80" y="115" text-anchor="middle" font-size="11" fill="#2B6CB0">当前帧</text>
  <text x="80" y="132" text-anchor="middle" font-size="10" fill="#718096">384×672</text>

  <rect x="140" y="90" width="100" height="60" rx="8" fill="#EBF8FF" stroke="#3182CE" stroke-width="1.5" filter="url(#sh)"/>
  <text x="190" y="115" text-anchor="middle" font-size="11" fill="#2B6CB0">未来帧</text>
  <text x="190" y="132" text-anchor="middle" font-size="10" fill="#718096">T 帧</text>

  <!-- VAE -->
  <rect x="60" y="180" width="180" height="40" rx="6" fill="#C6F6D5" stroke="#38A169" stroke-width="1.5" filter="url(#sh)"/>
  <text x="150" y="205" text-anchor="middle" font-size="12" fill="#276749">Wan2.2 VAE 编码</text>
  <line x1="80" y1="150" x2="120" y2="180" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="190" y1="150" x2="170" y2="180" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Video latents -->
  <rect x="50" y="250" width="200" height="35" rx="6" fill="#FAF5FF" stroke="#805AD5" stroke-width="1.5" filter="url(#sh)"/>
  <text x="150" y="272" text-anchor="middle" font-size="11" fill="#6B46C1">Video Latents (B,T,C',H',W')</text>
  <line x1="150" y1="220" x2="150" y2="250" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Text encoder -->
  <rect x="300" y="90" width="120" height="50" rx="8" fill="#FEEBC8" stroke="#DD6B20" stroke-width="1.5" filter="url(#sh)"/>
  <text x="360" y="112" text-anchor="middle" font-size="11" fill="#C05621">导航指令</text>
  <text x="360" y="128" text-anchor="middle" font-size="10" fill="#718096">T5 文本编码</text>

  <rect x="300" y="170" width="120" height="40" rx="6" fill="#FAF5FF" stroke="#805AD5" stroke-width="1.5" filter="url(#sh)"/>
  <text x="360" y="195" text-anchor="middle" font-size="11" fill="#6B46C1">Text Emb (B,S,4096)</text>
  <line x1="360" y1="140" x2="360" y2="170" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Noisy trajectory -->
  <rect x="300" y="250" width="120" height="35" rx="6" fill="#FFF5F5" stroke="#E53E3E" stroke-width="1.5" filter="url(#sh)"/>
  <text x="360" y="272" text-anchor="middle" font-size="11" fill="#C53030">Noisy Traj (B,50,3)</text>

  <!-- Video DiT -->
  <rect x="50" y="330" width="200" height="80" rx="10" fill="#EBF8FF" stroke="#3182CE" stroke-width="2" filter="url(#sh)"/>
  <text x="150" y="358" text-anchor="middle" font-size="13" font-weight="bold" fill="#2B6CB0">Video DiT</text>
  <text x="150" y="378" text-anchor="middle" font-size="10" fill="#718096">Wan2.2-5B (冻结)</text>
  <text x="150" y="396" text-anchor="middle" font-size="10" fill="#718096">预测未来帧</text>
  <line x1="150" y1="285" x2="150" y2="330" stroke="#3182CE" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- ActionDiT -->
  <rect x="300" y="330" width="200" height="80" rx="10" fill="#FFF5F5" stroke="#E53E3E" stroke-width="2" filter="url(#sh)"/>
  <text x="400" y="358" text-anchor="middle" font-size="13" font-weight="bold" fill="#C53030">ActionDiT</text>
  <text x="400" y="378" text-anchor="middle" font-size="10" fill="#718096">~0.2B 参数</text>
  <text x="400" y="396" text-anchor="middle" font-size="10" fill="#718096">生成轨迹</text>
  <line x1="360" y1="285" x2="360" y2="330" stroke="#E53E3E" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- MOT box -->
  <rect x="100" y="440" width="400" height="50" rx="8" fill="#FAF5FF" stroke="#805AD5" stroke-width="2" filter="url(#sh)"/>
  <text x="300" y="470" text-anchor="middle" font-size="12" font-weight="bold" fill="#6B46C1">MOT (Mixture-of-Transformers) + Isolated Attention Mask</text>
  <line x1="150" y1="410" x2="250" y2="440" stroke="#3182CE" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="400" y1="410" x2="350" y2="440" stroke="#E53E3E" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- Losses -->
  <rect x="80" y="520" width="160" height="35" rx="6" fill="#C6F6D5" stroke="#38A169" stroke-width="1.5" filter="url(#sh)"/>
  <text x="160" y="542" text-anchor="middle" font-size="11" fill="#276749">Video Loss (MSE)</text>

  <rect x="300" y="520" width="160" height="35" rx="6" fill="#C6F6D5" stroke="#38A169" stroke-width="1.5" filter="url(#sh)"/>
  <text x="380" y="542" text-anchor="middle" font-size="11" fill="#276749">Action Loss (MSE)</text>

  <line x1="200" y1="490" x2="160" y2="520" stroke="#38A169" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="400" y1="490" x2="380" y2="520" stroke="#38A169" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- ========== INFERENCE PHASE ========== -->
  <text x="820" y="65" text-anchor="middle" font-size="15" font-weight="bold" fill="#C05621">推理时（只用 ActionDiT）</text>

  <!-- Obs image only -->
  <rect x="670" y="90" width="100" height="50" rx="8" fill="#EBF8FF" stroke="#3182CE" stroke-width="1.5" filter="url(#sh)"/>
  <text x="720" y="112" text-anchor="middle" font-size="11" fill="#2B6CB0">当前帧</text>
  <text x="720" y="128" text-anchor="middle" font-size="10" fill="#718096">仅当前帧！</text>

  <!-- VAE encode obs -->
  <rect x="660" y="170" width="120" height="35" rx="6" fill="#C6F6D5" stroke="#38A169" stroke-width="1.5" filter="url(#sh)"/>
  <text x="720" y="192" text-anchor="middle" font-size="11" fill="#276749">VAE 编码</text>
  <line x1="720" y1="140" x2="720" y2="170" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- T5 encode -->
  <rect x="820" y="90" width="120" height="50" rx="8" fill="#FEEBC8" stroke="#DD6B20" stroke-width="1.5" filter="url(#sh)"/>
  <text x="880" y="112" text-anchor="middle" font-size="11" fill="#C05621">导航指令</text>
  <text x="880" y="128" text-anchor="middle" font-size="10" fill="#718096">T5 编码</text>

  <!-- Noise init -->
  <rect x="820" y="170" width="120" height="35" rx="6" fill="#FFF5F5" stroke="#E53E3E" stroke-width="1.5" filter="url(#sh)"/>
  <text x="880" y="192" text-anchor="middle" font-size="11" fill="#C53030">随机噪声 (B,50,3)</text>
  <line x1="880" y1="140" x2="880" y2="170" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ActionDiT inference -->
  <rect x="720" y="250" width="250" height="70" rx="10" fill="#FFF5F5" stroke="#E53E3E" stroke-width="2" filter="url(#sh)"/>
  <text x="845" y="278" text-anchor="middle" font-size="13" font-weight="bold" fill="#C53030">ActionDiT（只跑这个）</text>
  <text x="845" y="298" text-anchor="middle" font-size="10" fill="#718096">10 步欧拉积分 → 干净轨迹</text>
  <line x1="720" y1="205" x2="780" y2="250" stroke="#E53E3E" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <line x1="880" y1="205" x2="860" y2="250" stroke="#E53E3E" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- Output -->
  <rect x="750" y="360" width="190" height="45" rx="8" fill="#C6F6D5" stroke="#38A169" stroke-width="2" filter="url(#sh)"/>
  <text x="845" y="388" text-anchor="middle" font-size="12" font-weight="bold" fill="#276749">轨迹 (B, 50, 3)</text>
  <line x1="845" y1="320" x2="845" y2="360" stroke="#38A169" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- No Video DiT box -->
  <rect x="680" y="440" width="330" height="40" rx="6" fill="#FFF5F5" stroke="#E53E3E" stroke-width="2" stroke-dasharray="5,3" filter="url(#sh)"/>
  <text x="845" y="465" text-anchor="middle" font-size="12" font-weight="bold" fill="#C53030">❌ 不需要 Video DiT · 不需要生成未来帧</text>

  <!-- Arrow connecting training to inference -->
  <line x1="530" y1="465" x2="670" y2="465" stroke="#805AD5" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arr)"/>
  <text x="600" y="455" text-anchor="middle" font-size="10" fill="#805AD5">推理时扔掉</text>

  <!-- Legend -->
  <rect x="680" y="520" width="330" height="60" rx="6" fill="#F7FAFC" stroke="#CBD5E0" stroke-width="1"/>
  <text x="845" y="540" text-anchor="middle" font-size="11" font-weight="bold" fill="#4A5568">核心设计思想</text>
  <text x="695" y="558" font-size="10" fill="#4A5568">• 训练时：Video DiT + ActionDiT 联合训练，共享注意力</text>
  <text x="695" y="572" font-size="10" fill="#4A5568">• 推理时：只用 ActionDiT，不需要 Video DiT</text>
</svg>
