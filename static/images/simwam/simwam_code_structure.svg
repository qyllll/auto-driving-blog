  <rect x="585" y="155" width="180" height="25" rx="3" fill="#F0FFF4"/>
  <text x="675" y="172" text-anchor="middle" font-size="10" fill="#276749">train_navsim_grpo_*.sh</text>

  <!-- experiments/ -->
  <rect x="570" y="215" width="210" height="100" rx="10" fill="#FAF5FF" stroke="#805AD5" stroke-width="2" filter="url(#s)"/>
  <text x="675" y="240" text-anchor="middle" font-size="14" font-weight="bold" fill="#6B46C1">experiments/navsim/</text>

  <rect x="585" y="255" width="180" height="25" rx="3" fill="#FAF5FF"/>
  <text x="675" y="272" text-anchor="middle" font-size="10" fill="#6B46C1">eval_navsim.py · run_eval_*.sh</text>

  <!-- Reading order -->
  <rect x="30" y="500" width="750" height="85" rx="8" fill="#F7FAFC" stroke="#CBD5E0" stroke-width="1.5"/>
  <text x="405" y="522" text-anchor="middle" font-size="13" font-weight="bold" fill="#4A5568">建议阅读顺序</text>
  <text x="50" y="545" font-size="11" fill="#4A5568">① configs/model/simwam_navsim.yaml → ② action_dit.py → ③ mot.py → ④ simwam.py → ⑤ simwam_grpo.py → ⑥ trainer_grpo.py → ⑦ runtime_grpo.py</text>
  <text x="50" y="568" font-size="10" fill="#718096">先理解模型架构（①②③），再看训练流程（④⑤⑥），最后看入口脚本（⑦）</text>
</svg>
