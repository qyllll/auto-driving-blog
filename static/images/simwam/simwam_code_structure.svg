  <text x="155" y="242" text-anchor="middle" font-size="10" fill="#C53030">mot.py (24KB) ⭐ 联合注意力</text>

  <rect x="60" y="255" width="190" height="25" rx="3" fill="#F0FFF4" stroke="#38A169" stroke-width="1"/>
  <text x="155" y="272" text-anchor="middle" font-size="10" fill="#276749">lora.py · wan_video_dit.py · schedulers/</text>

  <rect x="50" y="295" width="210" height="25" rx="4" fill="#BEE3F8"/>
