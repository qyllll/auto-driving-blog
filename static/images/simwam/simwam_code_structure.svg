  <text x="155" y="382" text-anchor="middle" font-size="11" fill="#2B6CB0">datasets/navsim/</text>

  <rect x="50" y="400" width="210" height="25" rx="4" fill="#BEE3F8"/>
  <text x="155" y="417" text-anchor="middle" font-size="11" fill="#2B6CB0">utils/</text>

