<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <filter id="s" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
  </defs>

  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2D3748">WAM 路线对比：SimWAM vs DriveWAM vs DriveLaW</text>

  <!-- Header -->
  <rect x="30" y="55" width="840" height="40" rx="6" fill="#4A5568"/>
  <text x="100" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="white">维度</text>
  <text x="280" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="white">DriveWAM</text>
  <text x="470" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="white">DriveLaW</text>
  <text x="690" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="white">SimWAM</text>

  <!-- Row 1: Video Backbone -->
  <rect x="30" y="100" width="840" height="50" rx="0" fill="#F7FAFC"/>
  <text x="100" y="130" text-anchor="middle" font-size="11" fill="#4A5568">视频 Backbone</text>
  <text x="280" y="125" text-anchor="middle" font-size="11" fill="#4A5568">自训视频模型</text>
  <text x="470" y="125" text-anchor="middle" font-size="11" fill="#4A5568">自训视频模型</text>
  <text x="690" y="125" text-anchor="middle" font-size="11" font-weight="bold" fill="#276749">Wan2.2-5B（预训练）</text>
  <text x="690" y="140" text-anchor="middle" font-size="10" fill="#718096">直接用开源视频模型</text>

  <!-- Row 2: 推理时需生成未来帧 -->
  <rect x="30" y="155" width="840" height="50" rx="0" fill="white"/>
  <text x="100" y="185" text-anchor="middle" font-size="11" fill="#4A5568">推理时需生成未来帧？</text>
  <text x="280" y="185" text-anchor="middle" font-size="11" fill="#C53030">是（慢）</text>
  <text x="470" y="185" text-anchor="middle" font-size="11" fill="#C53030">是（慢）</text>
  <text x="690" y="185" text-anchor="middle" font-size="11" fill="#276749">否（快）</text>

  <!-- Row 3: 推理延迟 -->
  <rect x="30" y="210" width="840" height="50" rx="0" fill="#F7FAFC"/>
  <text x="100" y="240" text-anchor="middle" font-size="11" fill="#4A5568">推理延迟</text>
  <text x="280" y="240" text-anchor="middle" font-size="11" fill="#C53030">高</text>
  <text x="470" y="240" text-anchor="middle" font-size="11" fill="#C53030">高</text>
  <text x="690" y="240" text-anchor="middle" font-size="11" fill="#276749">低</text>

  <!-- Row 4: RL 后训练 -->
  <rect x="30" y="265" width="840" height="50" rx="0" fill="white"/>
  <text x="100" y="295" text-anchor="middle" font-size="11" fill="#4A5568">RL 后训练</text>
  <text x="280" y="295" text-anchor="middle" font-size="11" fill="#C53030">无</text>
  <text x="470" y="295" text-anchor="middle" font-size="11" fill="#C53030">无</text>
  <text x="690" y="295" text-anchor="middle" font-size="11" fill="#276749">FlowGRPO（LoRA）</text>

  <!-- Row 5: PDMS -->
  <rect x="30" y="320" width="840" height="50" rx="0" fill="#F7FAFC"/>
  <text x="100" y="350" text-anchor="middle" font-size="11" fill="#4A5568">NAVSIM PDMS</text>
  <text x="280" y="350" text-anchor="middle" font-size="11" fill="#4A5568">90.1</text>
  <text x="470" y="350" text-anchor="middle" font-size="11" fill="#4A5568">89.1</text>
  <text x="690" y="350" text-anchor="middle" font-size="13" font-weight="bold" fill="#276749">91.5 🏆</text>

  <!-- Row 6: 闭环 -->
  <rect x="30" y="375" width="840" height="50" rx="0" fill="white"/>
  <text x="100" y="405" text-anchor="middle" font-size="11" fill="#4A5568">AlpaSim 闭环 (at-fault)</text>
  <text x="280" y="405" text-anchor="middle" font-size="11" fill="#718096">-</text>
  <text x="470" y="405" text-anchor="middle" font-size="11" fill="#718096">-</text>
  <text x="690" y="405" text-anchor="middle" font-size="11" fill="#C53030">0.30</text>

  <!-- Highlight box -->
  <rect x="570" y="310" width="240" height="65" rx="6" fill="none" stroke="#38A169" stroke-width="2" stroke-dasharray="5,3"/>

  <!-- Note -->
  <rect x="30" y="440" width="840" height="45" rx="8" fill="#FFF5F5" stroke="#E53E3E" stroke-width="1"/>
  <text x="450" y="460" text-anchor="middle" font-size="11" fill="#C53030" font-weight="bold">⚠️ 共同短板：闭环场景（0.30 at-fault score）仍不如专门的闭环方法（Alpamayo-R1: 0.58）</text>
  <text x="450" y="476" text-anchor="middle" font-size="10" fill="#718096">原因：非反应式仿真训练 + PDM 奖励偏开环 + 闭环交互覆盖不足</text>
</svg>
