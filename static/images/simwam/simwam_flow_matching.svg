<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4A5568"/>
    </marker>
    <filter id="s" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
  </defs>

  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2D3748">SimWAM 中的 Flow Matching：两条并行路径</text>

  <!-- Training interpolation -->
  <text x="200" y="65" text-anchor="middle" font-size="14" font-weight="bold" fill="#2B6CB0">训练时：线性插值 + 速度场学习</text>

  <!-- x0 (noise) -->
  <rect x="30" y="90" width="100" height="60" rx="8" fill="#FFF5F5" stroke="#E53E3E" stroke-width="1.5" filter="url(#s)"/>
  <text x="80" y="115" text-anchor="middle" font-size="11" fill="#C53030">x₀ ~ N(0,I)</text>
  <text x="80" y="135" text-anchor="middle" font-size="10" fill="#718096">随机噪声</text>

  <!-- x1 (data) -->
  <rect x="270" y="90" width="100" height="60" rx="8" fill="#C6F6D5" stroke="#38A169" stroke-width="1.5" filter="url(#s)"/>
  <text x="320" y="115" text-anchor="middle" font-size="11" fill="#276749">x₁ = (traj, video)</text>
  <text x="320" y="135" text-anchor="middle" font-size="10" fill="#718096">专家轨迹+未来帧</text>

  <!-- Arrow -->
  <line x1="130" y1="120" x2="270" y2="120" stroke="#4A5568" stroke-width="2" marker-end="url(#a)"/>
  <text x="200" y="112" text-anchor="middle" font-size="10" fill="#4A5568">x_t = (1-t)x₀ + t·x₁</text>
  <text x="200" y="148" text-anchor="middle" font-size="10" fill="#4A5568">v = x₁ - x₀（正确速度）</text>

  <!-- Action path -->
  <rect x="30" y="190" width="100" height="50" rx="6" fill="#FFF5F5" stroke="#E53E3E" stroke-width="1"/>
  <text x="80" y="212" text-anchor="middle" font-size="10" fill="#C53030">噪声轨迹</text>
  <text x="80" y="228" text-anchor="middle" font-size="10" fill="#718096">(B,50,3)</text>

  <rect x="270" y="190" width="100" height="50" rx="6" fill="#C6F6D5" stroke="#38A169" stroke-width="1"/>
  <text x="320" y="212" text-anchor="middle" font-size="10" fill="#276749">专家轨迹</text>
  <text x="320" y="228" text-anchor="middle" font-size="10" fill="#718096">(B,50,3)</text>

  <line x1="130" y1="215" x2="270" y2="215" stroke="#E53E3E" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="200" y="210" text-anchor="middle" font-size="9" fill="#E53E30">Action 路径</text>

  <!-- Video path -->
  <rect x="30" y="260" width="100" height="50" rx="6" fill="#FFF5F5" stroke="#E53E3E" stroke-width="1"/>
  <text x="80" y="282" text-anchor="middle" font-size="10" fill="#C53030">噪声视频</text>
  <text x="80" y="298" text-anchor="middle" font-size="10" fill="#718096">(B,T,C',H',W')</text>

  <rect x="270" y="260" width="100" height="50" rx="6" fill="#C6F6D5" stroke="#38A169" stroke-width="1"/>
  <text x="320" y="282" text-anchor="middle" font-size="10" fill="#276749">未来帧 latent</text>
  <text x="320" y="298" text-anchor="middle" font-size="10" fill="#718096">(B,T,C',H',W')</text>

  <line x1="130" y1="285" x2="270" y2="285" stroke="#3182CE" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="200" y="280" text-anchor="middle" font-size="9" fill="#3182CE">Video 路径</text>

  <!-- Right side: inference -->
  <text x="580" y="65" text-anchor="middle" font-size="14" font-weight="bold" fill="#C05621">推理时：只走 Action 路径</text>

  <rect x="440" y="90" width="120" height="50" rx="8" fill="#FFF5F5" stroke="#E53E3E" stroke-width="1.5" filter="url(#s)"/>
  <text x="500" y="112" text-anchor="middle" font-size="11" fill="#C53030">x₀ ~ N(0,I)</text>
  <text x="500" y="128" text-anchor="middle" font-size="10" fill="#718096">随机噪声</text>

  <rect x="640" y="90" width="120" height="50" rx="8" fill="#C6F6D5" stroke="#38A169" stroke-width="2" filter="url(#s)"/>
  <text x="700" y="112" text-anchor="middle" font-size="11" font-weight="bold" fill="#276749">轨迹 (B,50,3)</text>
  <text x="700" y="128" text-anchor="middle" font-size="10" fill="#718096">可执行路径</text>

  <line x1="560" y1="115" x2="640" y2="115" stroke="#E53E3E" stroke-width="2" marker-end="url(#a)"/>

  <!-- Euler steps -->
  <rect x="460" y="160" width="300" height="100" rx="8" fill="#FEEBC8" stroke="#DD6B20" stroke-width="1.5" filter="url(#s)"/>
  <text x="610" y="182" text-anchor="middle" font-size="11" font-weight="bold" fill="#C05621">10 步欧拉积分</text>
  <text x="475" y="205" font-size="10" fill="#4A5568">for k in range(10):</text>
  <text x="490" y="222" font-size="10" fill="#4A5568">t = k / 10</text>
  <text x="490" y="239" font-size="10" fill="#4A5568">v = ActionDiT(x, t, ...)</text>
  <text x="490" y="256" font-size="10" fill="#C05621" font-weight="bold">x = x + v × 0.1</text>

  <!-- Cross attention -->
  <rect x="440" y="290" width="320" height="80" rx="8" fill="#FAF5FF" stroke="#805AD5" stroke-width="1.5" filter="url(#s)"/>
  <text x="600" y="312" text-anchor="middle" font-size="11" font-weight="bold" fill="#6B46C1">ActionDiT 内部</text>
  <text x="455" y="335" font-size="10" fill="#4A5568">1. Self-Attn: 动作 token 互相看（因果掩码）</text>
  <text x="455" y="352" font-size="10" fill="#4A5568">2. Cross-Attn: 读 VLM 缓存 KV（观测编码）</text>
  <text x="455" y="369" font-size="10" fill="#4A5568">3. FFN: 非线性变换</text>
</svg>
