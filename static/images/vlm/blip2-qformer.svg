<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620">
  <style>
    text { font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 13px; fill: #333; }
    .title { font-size: 18px; font-weight: bold; fill: #1a1a2e; }
    .sub { font-size: 12px; fill: #888; }
    .box-title { font-size: 13px; font-weight: bold; fill: #fff; }
    .note { font-size: 11px; fill: #555; }
    .tiny { font-size: 10px; fill: #666; }
  </style>

  <text x="450" y="30" text-anchor="middle" class="title">第二代：BLIP-2 的 Q-Former —— 用可学习的 Query 桥接视觉与语言</text>
  <text x="450" y="52" text-anchor="middle" class="sub">一组 32 个可学习 Query 通过交叉注意力从 ViT 特征中“选取”最关键的信息</text>

  <!-- Frozen ViT -->
  <rect x="60" y="110" width="200" height="90" rx="8" fill="#5D6D7E"/>
  <text x="160" y="137" text-anchor="middle" class="box-title">ViT 编码器</text>
  <text x="160" y="158" text-anchor="middle" class="tiny" fill="#E5E8E8">冻结（不训练）</text>
  <text x="160" y="174" text-anchor="middle" class="tiny" fill="#E5E8E8">输出 257 个 patch 特征</text>
  <text x="160" y="190" text-anchor="middle" class="tiny" fill="#E5E8E8">(256 patch + [CLS])</text>

  <!-- Q-Former -->
  <rect x="330" y="80" width="280" height="230" rx="10" fill="#8E44AD"/>
  <text x="470" y="110" text-anchor="middle" class="box-title">Q-Former（桥接模块）</text>

  <rect x="350" y="125" width="95" height="50" rx="6" fill="#A569BD"/>
  <text x="397" y="147" text-anchor="middle" class="tiny" fill="#fff">32 个可学习</text>
  <text x="397" y="162" text-anchor="middle" class="tiny" fill="#fff">Query 向量</text>

  <rect x="495" y="125" width="95" height="50" rx="6" fill="#A569BD"/>
  <text x="542" y="147" text-anchor="middle" class="tiny" fill="#fff">交叉注意力</text>
  <text x="542" y="162" text-anchor="middle" class="tiny" fill="#fff">(attn 到 ViT)</text>

  <rect x="350" y="195" width="240" height="45" rx="6" fill="#C39BD3"/>
  <text x="470" y="214" text-anchor="middle" class="tiny" fill="#4A235A">每个 Query 都去“问” ViT 特征</text>
  <text x="470" y="230" text-anchor="middle" class="tiny" fill="#4A235A">→ 提取出最相关的信息</text>

  <rect x="350" y="250" width="240" height="40" rx="6" fill="#BB8FCE"/>
  <text x="470" y="269" text-anchor="middle" class="tiny" fill="#4A235A">输出压缩成 32 个视觉 token</text>
  <text x="470" y="280" text-anchor="middle" class="tiny" fill="#4A235A">（信息瓶颈：257 → 32）</text>

  <!-- Frozen LLM -->
  <rect x="680" y="110" width="180" height="90" rx="8" fill="#1F618D"/>
  <text x="770" y="137" text-anchor="middle" class="box-title">LLM</text>
  <text x="770" y="158" text-anchor="middle" class="tiny" fill="#D6EAF8">冻结（不训练）</text>
  <text x="770" y="174" text-anchor="middle" class="tiny" fill="#D6EAF8">接收 32 个视觉 token</text>
  <text x="770" y="190" text-anchor="middle" class="tiny" fill="#D6EAF8">结合文本做生成</text>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#555"/>
    </marker>
  </defs>

  <line x1="260" y1="150" x2="326" y2="175" stroke="#8E44AD" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="610" y1="170" x2="676" y2="160" stroke="#1F618D" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="680" y1="110" x2="470" y2="205" stroke="#8E44AD" stroke-width="2" stroke-dasharray="4" marker-end="url(#arr)"/>

  <text x="300" y="220" text-anchor="middle" class="tiny" fill="#8E44AD">交叉注意力</text>

  <!-- Phase badges -->
  <text x="450" y="340" text-anchor="middle" class="box-title" fill="#2C3E50">BLIP-2 的三阶段训练（冻结策略逐步放开）</text>

  <rect x="60" y="360" width="240" height="75" rx="8" fill="#EAF2F8" stroke="#2980B9"/>
  <text x="180" y="383" text-anchor="middle" class="note" fill="#2471A3"><tspan font-weight="bold">阶段 1：表示学习</tspan></text>
  <text x="180" y="402" text-anchor="middle" class="tiny">对比损失 + ITM + 图文生成</text>
  <text x="180" y="419" text-anchor="middle" class="tiny">冻结：ViT</text>

  <rect x="330" y="360" width="240" height="75" rx="8" fill="#FEF9E7" stroke="#F39C12"/>
  <text x="450" y="383" text-anchor="middle" class="note" fill="#B9770E"><tspan font-weight="bold">阶段 2：生成学习</tspan></text>
  <text x="450" y="402" text-anchor="middle" class="tiny">用文本生成目标训 LLM 适配</text>
  <text x="450" y="419" text-anchor="middle" class="tiny">冻结：ViT + LLM</text>

  <rect x="600" y="360" width="240" height="75" rx="8" fill="#E8F8E8" stroke="#27AE60"/>
  <text x="720" y="383" text-anchor="middle" class="note" fill="#1E8449"><tspan font-weight="bold">阶段 3：端到端微调</tspan></text>
  <text x="720" y="402" text-anchor="middle" class="tiny">在目标任务上全量微调</text>
  <text x="720" y="419" text-anchor="middle" class="tiny">冻结：全部放开</text>

  <line x1="300" y1="397" x2="326" y2="397" stroke="#888" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="570" y1="397" x2="596" y2="397" stroke="#888" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Why efficient -->
  <rect x="60" y="470" width="780" height="80" rx="8" fill="#F7F9FB" stroke="#D5D8DC"/>
  <text x="450" y="493" text-anchor="middle" class="note" fill="#2C3E50"><tspan font-weight="bold">为什么参数高效？</tspan></text>
  <text x="450" y="514" text-anchor="middle" class="tiny" fill="#555">Q-Former 只有 ~188M 参数，却能在 7B~70B 的 LLM 前先完成“信息压缩”：257 个 patch 特征被 Query 选取后只剩 32 个 token</text>
  <text x="450" y="532" text-anchor="middle" class="tiny" fill="#555">省下的不只是参数量——32 个 token 送入 LLM 的上下文开销，远小于直接把全部 257 个 patch 都塞进去</text>
</svg>