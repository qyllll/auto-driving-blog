<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="824" viewBox="0 0 1240 824" font-family="Noto Sans CJK SC, sans-serif">
  <rect width="1240" height="824" fill="#fbfaf7"/>
  <text x="620" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#1a1a2e">Zetta 总架构：在线执行（左）⇄ 离线进化（右），三个时间尺度的循环</text>
  <!-- ============ LEFT: online ============ -->
  <rect x="30" y="60" width="560" height="670" rx="12" fill="#eef4fb" stroke="#9dbfe0" stroke-width="2"/>
  <text x="310" y="90" text-anchor="middle" font-size="17" font-weight="bold" fill="#00458f">在线：Parallel Rollouts（并行推演）</text>
  <!-- frozen policy -->
  <rect x="55" y="110" width="250" height="92" rx="8" fill="#fff" stroke="#00458f" stroke-width="2"/>
  <text x="180" y="133" text-anchor="middle" font-size="14" font-weight="bold" fill="#00458f">冻结底座策略 π（∇θ=0）</text>
  <text x="180" y="153" text-anchor="middle" font-size="12.5" fill="#333">LIBERO-Pro: π0.5</text>
  <text x="180" y="171" text-anchor="middle" font-size="12.5" fill="#333">RoboCasa: GR00T N1.5</text>
  <text x="180" y="190" text-anchor="middle" font-size="12" fill="#8b0000">不微调、不更新权重</text>
  <!-- orchestrator -->
  <rect x="330" y="110" width="235" height="92" rx="8" fill="#fff" stroke="#555" stroke-width="2"/>
  <text x="447" y="133" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Orchestrator A_orch（固定）</text>
  <text x="447" y="153" text-anchor="middle" font-size="12.5" fill="#333">多模态推理，裁决是否干预</text>
  <text x="447" y="171" text-anchor="middle" font-size="12.5" fill="#333">σ=0 走 VLA，σ&gt;0 走工具</text>
  <text x="447" y="190" text-anchor="middle" font-size="12" fill="#555">证据 e_t 被验证才允许介入</text>
  <line x1="305" y1="156" x2="330" y2="156" stroke="#333" stroke-width="2" marker-end="url(#ar)"/>
  <!-- harness -->
  <rect x="55" y="230" width="510" height="205" rx="8" fill="#fff7e6" stroke="#d89614" stroke-width="2.5"/>
  <text x="310" y="256" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#b06f00">可进化工具集 H = {C, R, T}（本文进化的对象）</text>
  <rect x="72" y="270" width="155" height="74" rx="6" fill="#fff" stroke="#d89614"/>
  <text x="149" y="291" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#b06f00">C 运行时评论家</text>
  <text x="149" y="310" text-anchor="middle" font-size="12" fill="#333">高频扫描轨迹 τ0:t</text>
  <text x="149" y="327" text-anchor="middle" font-size="12" fill="#333">输出证据 e_t + 建议 σ̂</text>
  <rect x="238" y="270" width="155" height="74" rx="6" fill="#fff" stroke="#d89614"/>
  <text x="315" y="291" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#b06f00">R 恢复技能库</text>
  <text x="315" y="310" text-anchor="middle" font-size="12" fill="#333">证据 → 干预策略映射</text>
  <text x="315" y="327" text-anchor="middle" font-size="12" fill="#333">重抓 / 再接近 / 稳定放置</text>
  <rect x="404" y="270" width="148" height="74" rx="6" fill="#fff" stroke="#d89614"/>
  <text x="478" y="291" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#b06f00">T 异构工具箱</text>
  <text x="478" y="310" text-anchor="middle" font-size="12" fill="#333">GraspGen / CAP / 规划器</text>
  <text x="478" y="327" text-anchor="middle" font-size="12" fill="#333">可生成、可实例化</text>
  <rect x="72" y="356" width="480" height="62" rx="6" fill="#fff" stroke="#d89614"/>
  <text x="312" y="377" text-anchor="middle" font-size="13" fill="#333">VLA 再入契约 Ψ(s)=1[故障清除] ∧ 1[接触稳定 &gt; γ]</text>
  <text x="312" y="396" text-anchor="middle" font-size="12.5" fill="#555">只有恢复完成、接触力达平衡，控制权才交还冻结策略——防止二次失败</text>
  <text x="312" y="413" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b06f00">Loop 1 · 动作频率级：评论家常驻监控，随时触发恢复</text>
  <!-- rollout -->
  <rect x="55" y="455" width="510" height="105" rx="8" fill="#fff" stroke="#00458f" stroke-width="2"/>
  <text x="310" y="478" text-anchor="middle" font-size="14" font-weight="bold" fill="#00458f">Rollout 产物（append-only 多模态轨迹）</text>
  <text x="310" y="500" text-anchor="middle" font-size="12.5" fill="#333">τ = {(s_t, a_t, μ_t, φ_t)}：状态 / 动作 / 语义里程碑进度 / 碰撞强度·接触力</text>
  <text x="310" y="520" text-anchor="middle" font-size="12.5" fill="#333">区分基础设施失败（强制重跑）与策略失败（计入统计）</text>
  <text x="310" y="541" text-anchor="middle" font-size="12.5" fill="#00458f">成功轨迹 → 成功参照索引 I_succ（标称分布）；失败 → 失败清单 + 首个缺失里程碑 m*</text>
  <!-- infra note -->
  <rect x="55" y="578" width="510" height="132" rx="8" fill="#e8f0fa" stroke="#5b86c0" stroke-dasharray="6 4"/>
  <text x="310" y="601" text-anchor="middle" font-size="14" font-weight="bold" fill="#00458f">Z-Infra：Rollout 基础设施（吞吐即进化速度）</text>
  <text x="310" y="623" text-anchor="middle" font-size="12.5" fill="#333">Control Plane 路由 + Env Worker 会话池 + Rollout Worker 常驻 GPU 服务</text>
  <text x="310" y="643" text-anchor="middle" font-size="12.5" fill="#333">VLM/动作专家分进程部署、动态批处理、可选量化、异步调度</text>
  <text x="310" y="665" text-anchor="middle" font-size="13" font-weight="bold" fill="#00458f">吞吐 1.7 → 35.1 episodes/min（12.8× vs RPent）</text>
  <text x="310" y="685" text-anchor="middle" font-size="13" font-weight="bold" fill="#00458f">推理延迟 −91%（11.1× 加速）；并发 32 时延迟仅 39→57s</text>
  <!-- ============ RIGHT: offline ============ -->
  <rect x="650" y="60" width="560" height="670" rx="12" fill="#fdf2f2" stroke="#e0a8a8" stroke-width="2"/>
  <text x="930" y="90" text-anchor="middle" font-size="17" font-weight="bold" fill="#8b0000">离线：Reflection &amp; Evolve（进化三阶段）</text>
  <!-- phase I -->
  <rect x="675" y="108" width="510" height="122" rx="8" fill="#fff" stroke="#8b0000" stroke-width="2"/>
  <text x="930" y="131" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#8b0000">Phase I · 经验剖析（Loop 1 收口）</text>
  <text x="930" y="153" text-anchor="middle" font-size="12.5" fill="#333">开发集种子上跑纯 VLA 基线 → 成功参照 + 失败清单</text>
  <text x="930" y="173" text-anchor="middle" font-size="12.5" fill="#333">首个缺失里程碑 m* 定位「断在哪一阶段」</text>
  <text x="930" y="193" text-anchor="middle" font-size="12.5" fill="#333">按最早可观察偏离 t_EOD 聚类失败 → 每簇选 medoid 种子</text>
  <text x="930" y="215" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8b0000">Loop 2 · rollout 批次级：聚类 + 候选提议</text>
  <polygon points="930,236 922,236 938,236" fill="#8b0000"/>
  <line x1="930" y1="230" x2="930" y2="248" stroke="#8b0000" stroke-width="3" marker-end="url(#arR)"/>
  <!-- phase II -->
  <rect x="675" y="252" width="510" height="170" rx="8" fill="#fff" stroke="#8b0000" stroke-width="2"/>
  <text x="930" y="275" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#8b0000">Phase II · 因果诊断 + 最小修复 + 验证</text>
  <text x="930" y="297" text-anchor="middle" font-size="12.5" fill="#333">自顶向下六层排查（高层能修就不动底层）：</text>
  <text x="930" y="317" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333">Evaluation → Critic → State → Planning → Recovery → Parameter</text>
  <text x="930" y="339" text-anchor="middle" font-size="12.5" fill="#333">单视角锚定协议（防多视角幻觉）→ 输出定位层 L* 与修复规格</text>
  <text x="930" y="359" text-anchor="middle" font-size="12.5" fill="#333">修复 = 补强 C* + 起草 R*/T*，带再入契约；两步闭环验证：</text>
  <text x="930" y="379" text-anchor="middle" font-size="12.5" fill="#333">① 诊断回放确认 t_EOD 被新评论家抓到 ② 全新 rollout 跑通</text>
  <text x="930" y="402" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8b0000">代码空间的「SGD」：借 SkillOpt/EmbodiSkill 做有界稳定更新（无梯度）</text>
  <line x1="930" y1="422" x2="930" y2="440" stroke="#8b0000" stroke-width="3" marker-end="url(#arR)"/>
  <!-- phase III -->
  <rect x="675" y="444" width="510" height="150" rx="8" fill="#fff" stroke="#8b0000" stroke-width="2"/>
  <text x="930" y="467" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#8b0000">Phase III · 整合打包 + 泛化门控</text>
  <text x="930" y="489" text-anchor="middle" font-size="12.5" fill="#333">跨种子整合：C 触发条件取逻辑 OR、R 泛化动作序列、T 扩充新工具</text>
  <text x="930" y="509" text-anchor="middle" font-size="12.5" fill="#333">产出版本化技能包：SKILL.md + tools/ + plans/ + params/</text>
  <text x="930" y="531" text-anchor="middle" font-size="12.5" fill="#333">双门控：历史回归 100% 通过 + 严格隔离 held-out 集 ΔSR&gt;0</text>
  <text x="930" y="551" text-anchor="middle" font-size="12.5" fill="#333">held-out 暴露新故障 → 该种子降级为开发集，另取新集再验</text>
  <text x="930" y="576" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8b0000">Loop 3 · 迭代级：只有验证通过的技能才进记忆库</text>
  <!-- feedback arrows -->
  <path d="M 930 730 C 930 796, 310 796, 310 730" fill="none" stroke="#d84315" stroke-width="3" marker-end="url(#arOUp)"/>
  <text x="620" y="815" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#d84315">验证后的 H_merged 反馈回在线执行（技能记忆只增不减，历史回归必须保持 100%）</text>
  <path d="M 578 528 C 620 556, 634 578, 668 604" fill="none" stroke="#00458f" stroke-width="3" marker-end="url(#arB)"/>
  <text x="628" y="585" font-size="12.5" fill="#00458f" transform="rotate(-38 628 585)">失败轨迹上行</text>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#333"/></marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8b0000"/></marker>
    <marker id="arO" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d84315"/></marker>
    <marker id="arOUp" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d84315" transform="rotate(-90 5 5)"/></marker>
    <marker id="arB" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#00458f"/></marker>
  </defs>
</svg>
